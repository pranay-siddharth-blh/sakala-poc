  const cmd = text.trim().toLowerCase();
  if (/^(hi+|hello|hey|menu|start|namaskara|namaste|ನಮಸ್ಕಾರ|ನಮಸ್ತೆ)[!. ]*$/.test(cmd)) return waMenu();
  if (/^(track|status|ಸ್ಥಿತಿ)\b/.test(cmd)) return waTrack();
  if (WA.flow!=='grievance'){ WA.flow='grievance'; WA.draft={}; resetStages(); }
  setChips(null);
  stage(0, viaVoice?'Voice note received on WhatsApp':viaImage?'Photo of petition received':'Message received on WhatsApp');
  const masked = mask(text); await sleep(250);
  stage(1, masked!==text?'1 personal number masked before AI':'Nothing personal to mask');
  stage(2, 'Reading the request…','run');
  const u = understand(masked); await sleep(650);
  if (u.type==='WRONG_DOOR'){ stage(2,'Not a grievance (RTI)','warn'); return botSay(`ℹ️ ${esc(u.reason)}`).then(waMenu); }
  if (u.type==='OUT_OF_SCOPE'){ stage(2, `${u.dept} · outside pilot`,'warn');
    await botSay(`I understood this as <b>${esc(u.dept)}</b> → <b>${esc(u.line)}</b>.<br><br>This department is outside the 3 pilot departments, so in production it goes straight to the CESC field officer through iPGRS. <span class="wa-prod">PRODUCTION PHASE</span>`); return waMenu(); }
  if (u.type==='LOW'){ stage(2,'Unclear · confidence 41%','warn'); const id='GR-'+(++S.seq);
    S.cases.push({id,text,masked,src:'whatsapp',district:'Mysuru',taluk:'Piriyapatna',gp:'',u,owner:'rd_eo_pp',level:'L2',levelSince:new Date(S.now),created:new Date(S.now),status:'Scrutiny',history:[{t:new Date(S.now),who:'Sakala AI',what:'Sent to scrutiny desk',c:'#c98a00',note:'Low confidence'}],mine:true});
    return botSay(`I want to be sure this reaches the right office, so a <b>person at the scrutiny desk</b> will check it. Reference <b>${id}</b>. You will hear from us here. 🙏`).then(waMenu); }
  if (u.type==='APPLICATION'){ const sv=SERVICES.find(s=>s.t===u.svc)||SERVICES[0]; stage(2,`Service request · ${sv.t} (Sakala-notified)`);
    return botSay(`This is a request for a <b>Sakala-guaranteed service</b>: <b>${esc(sv.t)}</b>.<br>It has a legal deadline of <b>${sv.days} days</b>. Shall I start the application?`,{buttons:[{label:'📄 Apply now',go:()=>applyStart(sv)},{label:'🏠 Main menu',go:waMenu}]}); }
  WA.draft = {text, masked, u, src: viaVoice?'whatsapp-voice':viaImage?'whatsapp-photo':'whatsapp'};
  stage(2, `${({REV:'Revenue',RDPR:'RDPR',FOOD:'Food & Civil Supplies'})[u.d]} › ${u.svc} · ${Math.round(u.conf*100)}%`);
  await botSay(`Got it 👍 I understand this as:<br><b>${esc(DEPTS[u.d].name)}</b> → ${esc(u.line)} → <b>${esc(u.svc)}</b><br><span class="wa-muted">“${esc(u.gr)}” · ${Math.round(u.conf*100)}% sure</span>${u.vulnerable?'<br>♥ <i>Marked as priority (vulnerable citizen)</i>':''}`);
  const gp = detectGP(text);
  if (gp){ WA.draft.gp=gp; WA.draft.taluk=talukOf(gp); stage(3, `Village found in message: ${gp}`); return waConfirm(); }
  stage(3,'Asking for the village / GP','run');
  await botSay('Where is this problem? Share your <b>📍 location</b> or choose the taluk.',{buttons:[
    {label:'📍 Share location', silent:true, go:()=>{ waPush({me:true,type:'loc',html:'Atthigudu, Piriyapatna',t:tnow()}); WA.draft.taluk='Piriyapatna'; WA.draft.gp='Atthigudu'; stage(3,'GPS → Atthigudu GP, Piriyapatna'); setTimeout(waConfirm,300);} },
    {label:'Piriyapatna', go:()=>askGP('Piriyapatna')},{label:'Hunsur', go:()=>askGP('Hunsur')}]});
}

const QS = ['Which officer has the most overdue cases?','How many pension complaints are pending in Piriyapatna?','Show pending cases by department','Which district had the highest late-delivery rate in 2025?','How many cases were auto-escalated?','Which channel brings the most complaints?','ಪಿರಿಯಾಪಟ್ಟಣದಲ್ಲಿ ಎಷ್ಟು ಕುಡಿಯುವ ನೀರಿನ ದೂರುಗಳಿವೆ?'];
function answer(q){
  const t=q.toLowerCase(); const open=S.cases.filter(c=>c.status!=='Resolved');
  const bars = rows => `<div class="hbar" style="margin-top:10px">${rows.map(([n,v,c])=>`<div class="hb"><span>${esc(n)}</span><span class="t"><b style="width:${v/Math.max(1,...rows.map(r=>r[1]))*100}%;--c:${c||'var(--g)'}"></b></span><span class="n">${v}</span></div>`).join('')}</div>`;
  if (t.includes('overdue') && t.includes('officer')){ const r=Object.keys(OFF).map(k=>[OFF[k].short,myCases(k).filter(c=>slaInfo(c).left<0).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    return r.length?{a:`<b>${esc(r[0][0])}</b> has the most overdue cases (<b>${r[0][1]}</b>).${bars(r.slice(0,5).map(x=>[...x,'var(--bad)']))}`,n:open.length}:{a:'No officer has an overdue case right now. Try moving the demo clock forward a few days.',n:open.length}; }
  if (t.includes('pension')){ const r=open.filter(c=>(c.u.svc||'').toLowerCase().includes('pension')&&(!t.includes('piriyapatna')||c.taluk==='Piriyapatna'));
    return {a:`<b>${r.length}</b> pension complaint${r.length!==1?'s are':' is'} pending${t.includes('piriyapatna')?' in Piriyapatna':''}: ${r.map(c=>`${c.id} (${OFF[c.owner].short}, ${slaInfo(c).left<0?'overdue':slaInfo(c).left+' days left'})`).join('; ')||'none'}.`,n:r.length}; }
  if (t.includes('department')){ return {a:'Pending requests by department:'+bars(Object.keys(DEPTS).map(k=>[DEPTS[k].name,open.filter(c=>c.u.d===k).length,DEPTS[k].c])),n:open.length}; }
  if (t.includes('district') || t.includes('2025') || t.includes('late')){ return {a:`<b>Bengaluru Urban</b> had the highest late-delivery rate in 2025: <b>9.18%</b> of Sakala applications were delivered after the deadline, and it held 6,326 overdue applications in December (about a third of the state).`+bars(REAL.worst.map(([n,p])=>[n,p,'var(--bad)'])),n:'Sakala 2025 reports · 372 district-months'}; }
  if (t.includes('escalat')){ const r=S.cases.filter(c=>c.history.some(h=>h.what.startsWith('Auto-escalated'))); return {a:`<b>${r.length}</b> case${r.length!==1?'s were':' was'} auto-escalated because the officer did not act in time: ${r.map(c=>`${c.id} → ${OFF[c.owner].short}`).join('; ')}.`,n:S.cases.length}; }
  if (t.includes('channel') || t.includes('source')){ return {a:'In the real sample week, <b>Praja Seva camps</b> brought the most complaints for these 3 departments (2,451), followed by Citizen Service Centres (1,261).'+bars(REAL.sources.slice(0,6)),n:'5,204 real grievances'}; }
  if (t.includes('ನೀರ') || t.includes('water')){ const r=open.filter(c=>(c.u.svc||'').includes('Water')&&c.taluk==='Piriyapatna'); return {a:`ಪಿರಿಯಾಪಟ್ಟಣದಲ್ಲಿ <b>${r.length}</b> ಕುಡಿಯುವ ನೀರಿನ ದೂರುಗಳು ಬಾಕಿ ಇವೆ. <br><span class="tiny">${r.length} drinking-water complaints are pending in Piriyapatna: ${r.map(c=>c.id+' ('+OFF[c.owner].short+')').join('; ')}.</span>`,n:r.length}; }
  return {a:`I can only answer from the data in this system, and I couldn’t find that. Try one of the suggested questions, or ask about officers, departments, pensions, escalations, channels or Sakala 2025 district performance.`,n:0,none:true};
}

  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', ()=>{ MAP.drag=null; svg.classList.remove('grab'); });
  svg.addEventListener('click', e=>{ const d=e.target.closest('.kdot'); if(d && !MAP.running) openCase(d.dataset.id); });
  svg.addEventListener('dblclick', e=>{ e.preventDefault(); const [px,py]=toSvg(e); zoomAbout(px,py,.5,true); });
  document.querySelectorAll('.kmap-btns [data-k]').forEach(b=>b.onclick=()=>{ hint.classList.add('off'); mapGo(b.dataset.k); });
  document.querySelectorAll('.ktk').forEach(b=>b.onclick=()=>{ hint.classList.add('off'); mapGo(b.dataset.tk); });
  document.querySelectorAll('.kc').forEach(b=>b.onclick=()=>setCat(MAP.cat===b.dataset.cat?null:b.dataset.cat)); MAP.cat=null;
  if (!MAP.ro){ MAP.ro=new ResizeObserver(()=>{ if(MAP.svg && !MAP.running) applyScale(); }); } MAP.ro.disconnect(); MAP.ro.observe(svg);
}

};
const pSub = k => typeof PROFILES[k].s==='function' ? PROFILES[k].s() : PROFILES[k].s;
const pAv = (k,extra='') => `<span class="prof-av" style="background:${PROFILES[k].bg};--ring:${PROFILES[k].ring}${extra}"><svg viewBox="0 0 24 24">${PROFILES[k].ic}</svg></span>`;
let profMenuOpen = false;
// every profile switch lands on that profile's home page: WhatsApp · My inbox · Command dashboard
function goHome(){ if (S.profile==='citizen') S.citizenView='wa'; else if (S.profile==='officer') S.officerView='inbox'; else S.csView='dash'; }
function renderProfSwitch(){
  const k = S.profile;
  $('#profSwitch').innerHTML = `
    <div class="prof-menu ${profMenuOpen?'on':''}" id="profMenu" role="menu">
      <h5>Switch profile</h5>
      ${Object.keys(PROFILES).map(p=>`<button class="prof-item ${p===k?'cur':''}" data-prof="${p}" role="menuitem">${pAv(p)}<span class="prof-txt"><b>${PROFILES[p].t}</b><small>${esc(pSub(p))}</small></span>${p===k?'<svg class="prof-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>':''}</button>`).join('')}
      <div class="prof-foot">Demo profiles · all three share live data <kbd>Esc</kbd></div>
    </div>
    <button class="prof-card ${profMenuOpen?'open':''}" id="profCard" aria-haspopup="menu" aria-expanded="${profMenuOpen}">
      ${pAv(k)}<span class="prof-txt"><b>${PROFILES[k].t}</b><small>${esc(pSub(k))}</small></span>
      <svg class="prof-chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>`;
  $('#profCard').onclick = e => { e.stopPropagation(); profMenuOpen = !profMenuOpen; renderProfSwitch(); };
  document.querySelectorAll('[data-prof]').forEach(b=>b.onclick = e => { e.stopPropagation(); const changed = S.profile!==b.dataset.prof; S.profile=b.dataset.prof; goHome(); profMenuOpen=false; closeDrawer(); render(); $('#main').scrollTop=0; if(changed) toast('Profile switched', PROFILES[S.profile].t+' · '+pSub(S.profile)); });
}
document.addEventListener('click', e => { if (profMenuOpen && !e.target.closest('#profSwitch')) { profMenuOpen=false; renderProfSwitch(); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && profMenuOpen) { profMenuOpen=false; renderProfSwitch(); } });

function goAI(){ const o=$('#goOverlay'); $('#govBrand').classList.add('thinking'); o.classList.add('on'); setTimeout(()=>{ S.profile='cs'; S.csView='ai'; profMenuOpen=false; closeDrawer(); render(); },420); setTimeout(()=>{ o.classList.remove('on'); $('#govBrand').classList.remove('thinking'); },1250); }
$('#aiBadge').onclick=goAI;
$('#plus1').onclick=()=>tick(1); $('#plus7').onclick=()=>tick(7); $('#clockReset').onclick=()=>{ seed(); render(); toast('Demo reset','Back to 14 Oct 2026 with the seeded cases.'); };
$('#lKn').onclick=()=>toast('ಕನ್ನಡ','Full Kannada interface comes in the build; labels are bilingual in this wireframe.');
