<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/sakala-logo.svg">
<title>Sakala AI · Citizen Request Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&family=Noto+Serif+Kannada:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#26732f; --g-deep:#14421a; --g-mid:#2f8a3b; --g-soft:#e8f4ee; --g-glow:#4da577;
  --saffron:#da6823; --saffron-soft:#fdf1e3;
  --gold:#b8892b; --gold-bright:#fbb756; --gold-deep:#8e6819; --gold-soft:#f7f1e3; --gold-line:#e4d3ab;
  --kn-yellow:#ffcd00; --kn-red:#d82221;
  --paper:#fbfaf6; --surface:#fff; --bg:#f2f6f4;
  --ink:#16231d; --muted:#5b6b64; --faint:#8a9a93; --border:#e1e9e5; --border-strong:#cbd9d2;
  --good:#1f9d57; --good-soft:#e5f5ec; --warn:#c98a00; --warn-soft:#fdf3dc; --bad:#c8372d; --bad-soft:#fcebea;
  --blue:#3b7dd8; --blue-soft:#e8f0fb; --violet:#6d4bc4; --violet-soft:#efeafb;
  --serif:"Noto Serif","Noto Serif Kannada",Georgia,serif;
  --sans:"Inter","Noto Sans Kannada","Noto Sans","Segoe UI",system-ui,Arial,sans-serif;
  --shadow:0 2px 10px rgba(20,66,26,.06); --shadow-lg:0 10px 30px rgba(20,66,26,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:15px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kn{font-family:"Noto Sans Kannada",var(--sans)}

/* splash */
.overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(circle at 50% 40%,var(--g-mid) 0%,var(--g) 50%,var(--g-deep) 100%);transition:opacity .5s,visibility .5s}
.overlay.off{opacity:0;visibility:hidden;pointer-events:none}
.halo{position:relative;display:inline-flex;border-radius:50%}
.halo::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,.15),#fbb756,rgba(255,255,255,.15),#fbb756,rgba(255,255,255,.15));animation:spin 1.8s linear infinite}
.halo .mark{position:relative;z-index:1;width:76px;height:76px}
.overlay-text{color:#fff;text-align:center;animation:fade .5s ease-out .2s both}
.overlay-text b{display:block;font-family:var(--serif);font-weight:600;font-size:1.35rem}
.overlay-text small{display:block;margin-top:8px;font-size:.7rem;letter-spacing:2.4px;text-transform:uppercase;color:#fdd59a}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(218,104,35,.5)}50%{box-shadow:0 0 0 8px rgba(218,104,35,0)}}

/* header */
.gov-header{flex:0 0 auto;background:var(--surface);z-index:5}
.gov-topbar{display:flex;align-items:center;gap:16px;padding:9px 22px}
.gov-brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.gov-brand .mark{width:44px;height:44px;flex:0 0 auto}
.brand-divider{width:1px;height:34px;background:var(--border)}
.gov-line1{font-size:.64rem;color:var(--gold-deep);font-weight:700;letter-spacing:2px;text-transform:uppercase}
.gov-line2{font-family:var(--serif);font-size:1.1rem;color:var(--g-deep);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gov-line2 span{color:var(--saffron)}
.clock{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:5px 8px 5px 12px;font-size:.76rem;color:var(--gold-deep)}
.clock b{color:var(--ink);font-size:.82rem}
.clock button{border:1px solid var(--gold-line);background:#fff;color:var(--gold-deep);font-weight:700;font-size:.72rem;padding:4px 9px;border-radius:7px;cursor:pointer}
.clock button:hover{background:var(--gold-bright);color:#3d2c00}
.lang-switch{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.lang-switch button{background:#fff;border:none;color:var(--muted);font-size:.76rem;font-weight:600;padding:6px 12px;cursor:pointer}
.lang-switch button+button{border-left:1px solid var(--border-strong)}
.lang-switch button.on{background:var(--g);color:#fff}
.app-bar{display:flex;align-items:center;gap:14px;padding:7px 22px;color:#fff;background:linear-gradient(100deg,var(--g-deep) 0%,var(--g) 55%,var(--g-mid) 100%)}
.profiles{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:3px;gap:3px}
.profiles button{display:flex;align-items:center;gap:7px;border:none;background:none;color:rgba(255,255,255,.85);font-weight:600;font-size:.8rem;padding:6px 14px;border-radius:9px;cursor:pointer;transition:all .18s}
.profiles button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.profiles button:hover{background:rgba(255,255,255,.12);color:#fff}
.profiles button.on{background:#fff;color:var(--g-deep);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.app-bar-text{font-size:.78rem;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.app-bar-text b{color:#fff}
.ai-badge{margin-left:auto;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:5px 13px 5px 10px;border-radius:999px;
  font-size:.66rem;font-weight:800;letter-spacing:1.2px;color:#fff;background:linear-gradient(135deg,rgba(251,183,86,.3),rgba(251,183,86,.08));border:1px solid rgba(251,183,86,.75);animation:glow 3s ease-in-out infinite}
.ai-badge::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shimmer 4s ease-in-out infinite}
.ai-badge svg{width:12px;height:12px;fill:#fbb756}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(251,183,86,0)}50%{box-shadow:0 0 14px 1px rgba(251,183,86,.45)}}
@keyframes shimmer{0%,15%{left:-60%}35%,100%{left:130%}}
.flag-rule{height:3px;background:linear-gradient(180deg,var(--kn-yellow) 0 50%,var(--kn-red) 50% 100%)}
.wf-tag{font-size:.6rem;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.5);color:#fff}

/* shell */
.app-shell{flex:1;display:flex;min-height:0;overflow:hidden}
.sidebar{flex:0 0 auto;width:282px;background:var(--paper);border-right:1px solid var(--border);overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:16px}
.side-h{margin:2px 4px 6px;display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:.78rem;font-weight:600;color:var(--g-deep)}
.side-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:9px;border:none;background:none;font-size:.84rem;font-weight:600;color:var(--ink);cursor:pointer;transition:background .15s}
.nav button .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--g-soft);color:var(--g);flex:0 0 auto}
.nav button .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav button small{display:block;font-size:.68rem;font-weight:500;color:var(--muted);margin-top:1px}
.nav button:hover{background:#fff}
.nav button.on{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(38,115,47,.22)}
.nav button.on small{color:rgba(255,255,255,.8)} .nav button.on .ic{background:rgba(255,255,255,.18);color:#fff}
.nav .cnt{margin-left:auto;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--saffron-soft);color:#9a4f00}
.nav button.on .cnt{background:#fff;color:var(--g-deep)}
.main{flex:1;overflow-y:auto;min-width:0;background:radial-gradient(ellipse at 92% 0%,rgba(218,104,35,.07),transparent 45%),radial-gradient(ellipse at 0% 0%,rgba(17,134,95,.08),transparent 50%),var(--bg)}
.content{max-width:1340px;margin:0 auto;padding:20px 26px 60px;animation:rise .35s ease-out}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold-deep)}
.head h1{margin:5px 0 0;font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--g-deep);line-height:1.2}
.head .sub{margin:5px 0 0;font-size:.82rem;color:var(--muted)}
.head-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-size:.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--g-deep);transition:all .15s}
.btn:hover{background:var(--g-soft)}
.btn.primary{background:linear-gradient(135deg,var(--g-mid),var(--g));color:#fff;border-color:var(--g);box-shadow:0 4px 12px rgba(38,115,47,.25)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.saffron{background:linear-gradient(135deg,#f29a3a,var(--saffron));color:#fff;border-color:var(--saffron)}
.btn.danger{color:var(--bad);border-color:#efc2bd} .btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:.76rem}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h3{margin:0;font-family:var(--serif);font-size:.98rem;font-weight:600;color:var(--g-deep)}
.card-h .r{margin-left:auto;font-size:.74rem;color:var(--muted)}
.card-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);animation:rise .4s ease-out both}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--g))}
.kpi .l{font-size:.7rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:1.75rem;font-weight:700;color:var(--ink);margin-top:4px;line-height:1}
.kpi .d{font-size:.74rem;color:var(--muted);margin-top:6px}
.kpi.hero{background:linear-gradient(135deg,var(--g-deep),var(--g) 60%,var(--g-mid));border:none;color:#fff}
.kpi.hero .l,.kpi.hero .d{color:rgba(255,255,255,.8)} .kpi.hero .v{color:#fff} .kpi.hero::before{background:var(--gold-bright)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1150px){.grid2,.grid3{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-g{background:var(--good-soft);color:#167a44} .b-w{background:var(--warn-soft);color:#8a5d00} .b-r{background:var(--bad-soft);color:#a12a22}
.b-b{background:var(--blue-soft);color:var(--blue)} .b-v{background:var(--violet-soft);color:var(--violet)} .b-n{background:#eef2f0;color:#4c5b55}
.b-s{background:var(--saffron-soft);color:#9a4f00}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:5px 11px;border-radius:999px;border:1px solid var(--border-strong);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--g);color:var(--g);background:var(--g-soft)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.3px}
.field input,.field select,.field textarea{border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(38,115,47,.12)}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.row,.row2{grid-template-columns:1fr}}
.inputbar{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.tool{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1px dashed var(--border-strong);background:var(--paper);color:var(--g-deep);font-size:.78rem;font-weight:700;cursor:pointer}
.tool:hover{border-color:var(--g);background:var(--g-soft)}
.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tool.rec{border-style:solid;border-color:var(--saffron);color:#9a4f00;background:var(--saffron-soft);animation:pulse 1.2s infinite}
.wave{display:inline-flex;gap:2px;align-items:center;height:14px} .wave i{width:3px;background:var(--saffron);border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:3px}50%{height:14px}}

/* source header */
.src-hero{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:14px;margin-bottom:16px;color:#fff;background:linear-gradient(110deg,var(--g-deep),var(--g) 60%,var(--g-mid));box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.src-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(251,183,86,.35),transparent 70%)}
.src-hero .big{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:0 0 auto}
.src-hero .big svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.src-hero h2{margin:0;font-family:var(--serif);font-weight:600;font-size:1.25rem}
.src-hero p{margin:4px 0 0;font-size:.8rem;color:rgba(255,255,255,.85)}
.src-hero .tag{margin-left:auto;z-index:1}
.phone{max-width:390px;margin:0 auto;border:10px solid #1d2a24;border-radius:34px;padding:14px 12px;background:#fff;box-shadow:var(--shadow-lg)}
.phone .notch{width:110px;height:18px;background:#1d2a24;border-radius:0 0 12px 12px;margin:-14px auto 10px}

/* AI pipeline animation */
.pipe{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--border);font-size:.82rem;color:var(--faint);transition:all .25s}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e7eeea;flex:0 0 auto;font-size:.7rem;font-weight:800;color:var(--faint)}
.step.run{color:var(--ink);border-color:var(--gold-line);background:var(--gold-soft)} .step.run .dot{background:var(--gold-bright);color:#3d2c00;animation:pulse 1s infinite}
.step.done{color:var(--ink);border-color:#bfe3cf;background:var(--good-soft)} .step.done .dot{background:var(--good);color:#fff}
.step small{margin-left:auto;color:var(--muted);font-size:.72rem}

/* result */
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 12px}
.path span{background:var(--g-soft);color:var(--g-deep);border:1px solid #c9e4d7;padding:5px 10px;border-radius:8px;font-size:.76rem;font-weight:600}
.path i{color:var(--faint);font-style:normal}
.conf{height:8px;border-radius:99px;background:#e6ece9;overflow:hidden} .conf>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g-glow),var(--g))}
.officer-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;border:1px solid #c9e4d7;background:linear-gradient(135deg,#f3faf6,#fff)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g-mid),var(--g-deep));flex:0 0 auto;font-size:.9rem}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.chain .lv{padding:6px 10px;border-radius:9px;font-size:.72rem;font-weight:700;background:#eef4f1;color:var(--g-deep);border:1px solid var(--border)}
.chain .lv.cur{background:var(--g);color:#fff;border-color:var(--g)}
.chain i{color:var(--faint);font-style:normal}
.agent{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bubble{max-width:85%;padding:10px 13px;border-radius:14px;font-size:.84rem;line-height:1.45;animation:rise .3s ease-out}
.bubble.ai{background:var(--g-soft);border:1px solid #c9e4d7;border-top-left-radius:4px}
.bubble.me{align-self:flex-end;background:var(--g);color:#fff;border-top-right-radius:4px}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:.82rem;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s} tbody tr:hover{background:#f6faf8}
tbody tr.sel{background:var(--g-soft)}
.sla{display:flex;flex-direction:column;gap:4px;min-width:110px}
.sla .bar{height:6px;border-radius:99px;background:#e6ece9;overflow:hidden} .sla .bar b{display:block;height:100%}
.sla small{font-size:.7rem;font-weight:700}
.tiny{font-size:.72rem;color:var(--muted)}
.ellip{max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,66,26,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,96vw);background:#fff;z-index:61;box-shadow:-10px 0 40px rgba(20,66,26,.2);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#f3faf6,#fff)}
.drawer-h h2{margin:0;font-family:var(--serif);font-size:1.12rem;color:var(--g-deep)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;background:var(--paper)}
.x{margin-left:auto;border:none;background:#eef3f0;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.sec{margin-bottom:16px} .sec h4{margin:0 0 8px;font-size:.7rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-deep)}
.quote{background:var(--paper);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.85rem;line-height:1.55}
.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl{position:relative;padding:0 0 12px 10px;font-size:.78rem}
.tl::before{content:"";position:absolute;left:-15px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--g));border:2px solid #fff;box-shadow:0 0 0 1px var(--c,var(--g))}
.tl b{display:block;font-size:.8rem} .tl span{color:var(--muted);font-size:.72rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:.8rem} .kv div:nth-child(odd){color:var(--muted)} .kv div:nth-child(even){font-weight:600}

/* banners & toasts */
.banner{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;margin-bottom:14px;font-size:.82rem;animation:rise .35s ease-out}
.banner.warn{background:var(--warn-soft);border:1px solid #f0d58d;color:#6b4b00}
.banner.info{background:var(--blue-soft);border:1px solid #c6d9f3;color:#1d4f8f}
.banner svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto}
.toasts{position:fixed;right:18px;bottom:18px;z-index:9000;display:flex;flex-direction:column;gap:8px}
.toast{min-width:260px;max-width:380px;background:var(--g-deep);color:#fff;padding:11px 14px;border-radius:12px;font-size:.8rem;box-shadow:var(--shadow-lg);animation:rise .3s ease-out;border-left:4px solid var(--gold-bright)}
.toast b{display:block;color:#fdd59a;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}

/* charts */
.hbar{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:.78rem}
.hb .t{height:12px;background:#eef3f0;border-radius:99px;overflow:hidden} .hb .t b{display:block;height:100%;border-radius:99px;background:var(--c,var(--g));transition:width .8s cubic-bezier(.2,.8,.2,1)}

.legend{display:flex;flex-direction:column;gap:6px;font-size:.78rem} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.mapbox{position:relative;height:270px;border-radius:12px;background:linear-gradient(180deg,#f4faf7,#eaf4ef);border:1px solid var(--border);overflow:hidden}
.mapbox svg{width:100%;height:100%}
.pin{cursor:pointer}

/* AI mode */
.ai-wrap{max-width:980px;margin:0 auto}
.ai-hero{text-align:center;padding:26px 10px 10px}
.ai-hero .orb{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3d1,var(--gold-bright) 35%,var(--g) 75%);box-shadow:0 0 30px rgba(233,185,73,.5);animation:pulse 2.4s infinite}
.ai-hero h2{margin:0;font-family:var(--serif);color:var(--g-deep);font-size:1.5rem}
.ai-hero p{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.chatlog{display:flex;flex-direction:column;gap:12px;margin:10px 0 90px}
.msg{max-width:88%;animation:rise .3s ease-out}
.msg.q{align-self:flex-end;background:var(--g);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:.88rem}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--border);padding:14px 16px;border-radius:14px 14px 14px 4px;box-shadow:var(--shadow);font-size:.86rem;line-height:1.55;width:88%}
.msg.a .src{margin-top:10px;font-size:.7rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px}
.askbar{position:sticky;bottom:0;padding:12px 0 16px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.askbar form{display:flex;gap:8px;background:#fff;border:1px solid var(--border-strong);border-radius:16px;padding:8px;box-shadow:var(--shadow-lg)}
.askbar input{flex:1;border:none;padding:10px 12px;font-size:.92rem;outline:none;background:transparent}
.typing{display:inline-flex;gap:4px} .typing i{width:7px;height:7px;border-radius:50%;background:var(--g);animation:wv2 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes wv2{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

.modal-bg{position:fixed;inset:0;background:rgba(20,66,26,.35);z-index:80;display:grid;place-items:center;padding:20px}
.modal{width:min(780px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);animation:rise .3s ease-out}
.modal-h{padding:18px 22px;background:linear-gradient(110deg,var(--g-deep),var(--g));color:#fff;display:flex;align-items:center;gap:10px;border-radius:16px 16px 0 0}
.modal-h h2{margin:0;font-family:var(--serif);font-size:1.15rem}
.modal-b{padding:18px 22px;font-size:.86rem;line-height:1.6}
.synthetic{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;background:#fff4e0;color:#8a5300;border:1px solid #f3cf8f;vertical-align:middle}
.prodtag{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;background:#f1f1f1;color:#555;border:1px dashed #bbb;vertical-align:middle}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:.86rem}
/* ===== 2026 polish layer (Sakala palette: green #26732f · amber #fbb756 · orange #da6823 · blue #4a91e4) ===== */

.hb .t{height:10px;background:#edf2ec}

/* ===== bottom-left profile switcher (app-style) ===== */
.sidebar-wrap{flex:0 0 auto;width:282px;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-right:1px solid rgba(38,115,47,.10);position:relative;z-index:20}

/* ===== Karnataka live map ===== */
.kmap{position:relative;height:460px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#f7fbf6,#e9f2ec 70%);border:1px solid rgba(20,66,26,.08)}
.kmap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
.kmap svg.grab{cursor:grabbing}
.kd{fill:#e6efe7;stroke:#fff;stroke-width:calc(var(--sw) * 1.1);transition:fill .2s}
.kd:hover{fill:#dbe8dd}
.kd-hl{fill:#fde7c4;stroke:#f0b45e;stroke-width:calc(var(--sw) * 1.4)}
.kd-hl:hover{fill:#fcdcab}
.kdl{fill:#5b6b64;font-family:var(--sans);font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;transition:opacity .2s}
.kdl-hl{fill:#9a4f00;font-weight:800}
.kt{fill:var(--f);fill-opacity:.55;stroke:var(--s);stroke-width:calc(var(--sw) * 1.6);cursor:pointer;transition:fill-opacity .2s}
.kt:hover{fill-opacity:.75}
.kt.on{fill-opacity:.22;stroke-width:calc(var(--sw) * 2.6)}
.ktl{fill:#14421a;font-family:var(--sans);font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:calc(var(--sw) * 3);letter-spacing:.02em}
.km{cursor:pointer;transition:opacity .2s}
.km-glow{fill:url(#kGlow);animation:kpulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.km-dot{stroke:#fff;stroke-width:calc(var(--sw) * 2)}
.km-n{fill:#fff;font-family:var(--sans);font-weight:800;text-anchor:middle;pointer-events:none}
@keyframes kpulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.kdot{stroke:#fff;stroke-width:calc(var(--sw) * 1.4);cursor:pointer;transition:opacity .25s}
.kdot:hover{stroke:#14421a;stroke-width:calc(var(--sw) * 2)}
.kmap-bar{position:absolute;left:12px;right:12px;top:10px;z-index:3;display:flex;align-items:center;gap:10px;pointer-events:none}
.crumbs{pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(20,66,26,.08);border-radius:12px;padding:6px 11px;font-size:.76rem;box-shadow:0 6px 18px -10px rgba(16,40,20,.3)}
.crumbs b{color:#26732f;cursor:pointer;font-weight:700}
.crumbs b:hover{text-decoration:underline}
.crumbs i{color:var(--faint);font-style:normal}
.kmap-btns{pointer-events:auto;margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(20,66,26,.08);border-radius:12px;padding:4px;box-shadow:0 6px 18px -10px rgba(16,40,20,.3)}
.kmap-btns button{border:none;background:none;border-radius:8px;padding:5px 10px;font-size:.74rem;font-weight:700;color:#14421a;cursor:pointer}
.kmap-btns button:hover{background:#eaf5ec}
.kmap-btns button[data-k="in"],.kmap-btns button[data-k="out"]{width:30px;padding:5px 0;font-size:.95rem}
.kmap-legend{position:absolute;left:12px;bottom:10px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(20,66,26,.08);border-radius:12px;padding:6px 11px;font-size:.7rem;color:#3d4c45}
.kmap-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kmap-legend i.r{border-radius:50%}
.kmap-legend .sep{width:1px;height:12px;background:rgba(20,66,26,.15)}
.kmap-hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);white-space:nowrap;z-index:3;font-size:.7rem;color:#fff;background:rgba(20,66,26,.78);border-radius:999px;padding:6px 12px;transition:opacity .4s}
.kmap-hint.off{opacity:0}
.kmap-tip{position:absolute;z-index:5;pointer-events:none;min-width:150px;max-width:240px;background:rgba(20,66,26,.95);color:#fff;border-radius:12px;padding:8px 11px;font-size:.72rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}

.kmap-tip b{display:block;font-size:.78rem;color:#fdd59a;margin-bottom:2px}
.kmap-tip span{display:block}

.kmap-attr{position:absolute;right:12px;bottom:12px;z-index:3;font-size:.6rem;color:#5b6b64;background:rgba(255,255,255,.75);padding:2px 7px;border-radius:6px}

/* ===== map v2: hero, bold outline, choropleth, side panel ===== */
.map-hero{margin-bottom:16px;border:1px solid rgba(38,115,47,.16);box-shadow:0 1px 2px rgba(16,40,20,.05),0 24px 60px -24px rgba(16,40,20,.35)}
.map-hero .card-h h3{font-size:1.08rem}
.kmap{height:560px;background:
  radial-gradient(70% 80% at 55% 45%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
  radial-gradient(circle at 1px 1px,rgba(20,66,26,.12) 1px,transparent 1.4px) 0 0/18px 18px,

.ktk:hover{transform:translateX(2px);box-shadow:0 6px 16px -8px rgba(16,40,20,.35);border-color:var(--s)}
.ktk.on{border-color:var(--s);box-shadow:0 0 0 3px color-mix(in srgb,var(--f) 35%,transparent)}
.ktk i{width:12px;height:12px;border-radius:4px;background:var(--f);box-shadow:inset 0 0 0 2px var(--s);flex:0 0 auto}
.ktk span{flex:1;min-width:0}.ktk b{display:block;font-size:.8rem;color:#14421a}.ktk small{display:block;font-size:.66rem;color:var(--muted)}
.ktk em{font-style:normal;text-align:right;font-weight:800;font-size:.95rem;color:#14421a;line-height:1}.ktk em small{font-weight:600;font-size:.6rem;color:var(--muted)}
.kleg{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.7rem;color:#3d4c45}.kleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.kscale{position:relative;font-size:.62rem;color:var(--muted);display:flex;justify-content:space-between;padding-top:14px}
.kscale b{position:absolute;left:0;right:0;top:0;height:9px;border-radius:99px;background:linear-gradient(90deg,rgb(191,227,198),rgb(226,236,181),rgb(253,224,166),rgb(248,191,134),rgb(239,143,116))}
.kmap-hint{top:auto;bottom:12px;left:auto;right:12px;transform:none}.kmap-attr{bottom:auto;top:62px;right:14px}
@media(max-width:900px){.kmap-side{display:none}}

/* ===== smooth map rendering: sizes from CSS variables, layer-level fades, no per-element transitions ===== */
#kSvg{--k:1;--dotr:4;--opDots:0;--opMark:1;--opDLab:0;--opTLab:0;--opHL:.85}
#kDots{opacity:var(--opDots);pointer-events:none}
#kSvg.dots-on #kDots{pointer-events:auto}
#kSvg.dots-on #kMark{pointer-events:none}
#kMark{opacity:var(--opMark)}
#kDLab{opacity:var(--opDLab)}
#kTLab{opacity:var(--opTLab)}
#kDLabHL{opacity:var(--opHL)}
.kdot{r:calc(var(--dotr) * 1px);transition:none}
.km{transition:none}
.km-dot{r:calc(var(--k) * 9px)}
.km-glow{r:calc(var(--k) * 18px)}
.km-n{font-size:calc(var(--k) * 9px);dominant-baseline:central}
.kdl{font-size:calc(var(--k) * 9.5px);transition:none}
.kdl-hl{font-size:calc(var(--k) * 11px)}
.ktl{font-size:calc(var(--k) * 12.5px);transition:none}
/* while moving: drop the expensive shadows & hover effects, keep motion silky */
.kmap.moving #kOut,.kmap.moving #kTal{filter:none}
.kmap.moving .kd:hover{filter:none}
.kmap.moving .km-glow{animation-play-state:paused}
.kmap-tip{left:0;top:0;transition:opacity .12s}

/* ===================== 2026 futuristic layer (KPCL / RDPR family, Sakala palette) ===================== */
:root{--aur1:#0b2a12;--aur2:#14421a;--aur3:#26732f;--glass:rgba(255,255,255,.07);--glass-b:rgba(255,255,255,.14)}

.go-overlay{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;

/* header: emblem + Sakala mark in halos */
.gov-topbar{padding:10px 22px}
.logo-halo{position:relative;display:inline-flex;border-radius:50%;flex:0 0 auto}
.logo-halo::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,rgba(38,115,47,.15),#fbb756,rgba(38,115,47,.15),#fbb756,rgba(38,115,47,.15));opacity:.0;transition:opacity .3s}
.gov-brand:hover .logo-halo::before,.gov-brand.thinking .logo-halo::before{opacity:1;animation:spin 1.8s linear infinite}
.logo-halo img,.logo-halo svg{position:relative;z-index:1;height:46px;width:46px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid var(--border);padding:3px}

/* page heroes: dark aurora glass */
.head{position:relative;overflow:hidden;isolation:isolate;padding:22px 24px;border-radius:24px;margin-bottom:18px;color:#fff;
  background:linear-gradient(125deg,var(--aur1),var(--aur2) 42%,#1f6a2a 75%,#2f8a3b);box-shadow:0 24px 50px -28px rgba(11,42,18,.75)}

  radial-gradient(28% 40% at 20% 30%,rgba(251,183,86,.35),transparent 70%),

.dash-link:hover .dash-ico i:nth-child(1){height:14px}.dash-link:hover .dash-ico i:nth-child(2){height:10px}.dash-link:hover .dash-ico i:nth-child(3){height:19px}.dash-link:hover .dash-ico i:nth-child(4){height:13px}

.wa-muted{color:#667781;font-size:.78rem}
.wa-prod{display:inline-block;margin-top:4px;font-size:.56rem;font-weight:800;letter-spacing:.7px;padding:2px 6px;border-radius:4px;border:1px dashed #9aa5ab;color:#54656f}
.wa-btns{display:flex;flex-direction:column;gap:3px;width:84%;margin-top:3px}
.wa-btns button{border:none;background:#fff;color:#008069;font-weight:600;font-size:.84rem;padding:9px 10px;border-radius:9px;box-shadow:0 1px .5px rgba(11,20,26,.13);cursor:pointer;transition:background .15s}
.wa-btns button:hover:not(:disabled){background:#f5f6f6}
.wa-btns button:disabled{color:#a5b0b6;cursor:default}
.wa-listbtn{color:#027eb5!important}
.wa-listbtn:disabled{color:#a5b0b6!important}
.wa-typing-row .wa-bub{padding:10px 14px}
.wa-dots{display:inline-flex;gap:4px}.wa-dots i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:wv2 1s infinite}
.wa-dots i:nth-child(2){animation-delay:.15s}.wa-dots i:nth-child(3){animation-delay:.3s}
.wa-card{font-size:.84rem}
.wa-sum b{display:block;font-size:.9rem;margin-bottom:6px}
.wa-sum span{display:block;font-size:.62rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#667781}
.wa-sum p{margin:1px 0 7px}
.wa-ok{position:relative;padding-left:2px}
.wa-ok .wa-okic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#25d366;color:#fff;font-weight:800;font-size:.75rem;margin-right:6px;vertical-align:-5px}
.wa-ok>b{font-size:.92rem}
.wa-ok p{margin:7px 0 0}
.wa-lad{display:flex;align-items:center;gap:4px;margin:6px 0 2px;font-size:.68rem;flex-wrap:wrap}
.wa-lad span{padding:3px 7px;border-radius:999px;background:#f0f2f5;color:#54656f;border:1px solid #e9edef;white-space:nowrap}
.wa-lad span.cur{background:#d9fdd3;color:#0b6b3a;border-color:#9fe3a9;font-weight:700}
.wa-lad span.done{color:#8696a0;text-decoration:line-through}
.wa-lad i{color:#8696a0;font-style:normal}
.wa-trk .last{font-size:.72rem;color:#8696a0;margin-top:4px;line-height:1.35}
.wa-trk .bad{color:#c8372d}
.wa-trk{margin-top:8px;padding-top:7px;border-top:1px solid #e9edef;display:flex;flex-direction:column;font-size:.78rem}
.wa-trk b{font-size:.84rem}.wa-trk span{color:#54656f}.wa-trk .ok{color:#128c4b;font-weight:600}.wa-trk .bad{color:#c8372d;font-weight:600}
.wa-voice{display:flex;align-items:center;gap:8px;min-width:210px;padding:2px 0}
.wa-play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#54656f;font-size:.85rem}
.wa-wave{display:flex;align-items:center;gap:2px;flex:1}.wa-wave i{width:3px;border-radius:2px;background:#8fa79a}
.wa-vlen{font-size:.66rem;color:#667781}
.wa-img{width:220px;height:150px;border-radius:6px;margin:-2px -4px 4px;background:linear-gradient(135deg,#c9b99a,#a8977a);display:grid;place-items:center;overflow:hidden}
.wa-img .paper{width:120px;height:136px;background:#fbf8f0;transform:rotate(-4deg);box-shadow:0 6px 14px rgba(0,0,0,.25);padding:10px;display:flex;flex-direction:column;gap:6px}
.wa-img .paper b{font-size:.62rem;text-align:center;color:#333}.wa-img .paper i{display:block;height:3px;border-radius:2px;background:#9aa0a6;opacity:.6}
.wa-loc{display:flex;flex-direction:column;width:220px}
.wa-loc .mapmini{height:110px;border-radius:6px;margin:-2px -4px 6px;position:relative;background:
  linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(0deg,transparent 30%,#fff 30% 34%,transparent 34%),linear-gradient(135deg,#cfe8d0,#e8f0dc 50%,#d5e6f5)}
.pinmini{position:absolute;left:50%;top:44%;width:18px;height:18px;border-radius:50% 50% 50% 0;background:#e53935;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.wa-loc b{font-size:.82rem}.wa-loc small{font-size:.7rem;color:#667781}
.wa-quick{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 10px;background:#efeae2;scrollbar-width:none;max-height:0;transition:max-height .25s,padding .25s}
.wa-quick:not(:empty){max-height:52px;padding:6px 10px 8px}
.wa-quick::-webkit-scrollbar{display:none}
.wa-quick button{flex:0 0 auto;border:1px solid rgba(0,128,105,.25);background:#fff;color:#008069;font-weight:600;font-size:.74rem;padding:7px 11px;border-radius:18px;cursor:pointer;box-shadow:0 1px .5px rgba(11,20,26,.1);white-space:nowrap;animation:waIn .3s both}
.wa-quick button:hover{background:#e7fce3}
.wa-compose{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 7px 4px;background:#f0f2f5}
.wa-field{position:relative;flex:1;display:flex;align-items:center;gap:9px;background:#fff;border-radius:24px;padding:8px 12px;min-width:0;overflow:hidden}
.wa-field>span{font-size:1.05rem;cursor:pointer;opacity:.62;filter:grayscale(1);transition:opacity .15s}
.wa-field>span:hover{opacity:1}
.wa-field input{flex:1;min-width:0;border:none;outline:none;font-size:.9rem;color:#111b21;background:transparent}
.wa-mic{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:#00a884;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .15s,background .15s}
.wa-mic:hover{transform:scale(1.05)}
.wa-mic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2}
.wa-rec{position:absolute;inset:0;display:none;align-items:center;gap:9px;padding:0 14px;background:#fff;color:#54656f;font-size:.82rem}
.wa-compose.rec .wa-rec{display:flex}
.wa-compose.rec .wa-mic{background:#e53935;transform:scale(1.12);animation:pulse 1s infinite}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#e53935;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rec-wave{display:flex;align-items:center;gap:2px;flex:1}.rec-wave i{width:3px;height:4px;border-radius:2px;background:#00a884;animation:wv .8s ease-in-out infinite}
.rec-wave i:nth-child(3n){animation-delay:.15s}.rec-wave i:nth-child(3n+1){animation-delay:.3s}.rec-wave i:nth-child(4n){animation-delay:.45s}
.rec-hint{font-size:.7rem;color:#8696a0}
.home-bar{flex:0 0 auto;height:20px;background:#f0f2f5;position:relative}
.home-bar::after{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:#111}
.wa-sheet-bg{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.38);opacity:0;transition:opacity .25s}
.wa-sheet-bg.on{opacity:1}
.wa-sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:72%;overflow-y:auto;background:#fff;color:#111b21;border-radius:20px 20px 0 0;padding:6px 0 24px;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.wa-sheet.on{transform:none}
.wa-sheet .grab{width:38px;height:5px;border-radius:3px;background:#d1d7db;margin:4px auto 8px}
.wa-sheet h4{margin:4px 18px 8px;font-size:.92rem;text-align:center}
.wa-sheet button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:11px 18px;border-top:1px solid #f0f2f5;cursor:pointer}
.wa-sheet button:hover{background:#f5f6f6}
.wa-sheet button span{flex:1}.wa-sheet button b{display:block;font-size:.88rem;font-weight:500}.wa-sheet button small{display:block;font-size:.72rem;color:#667781;margin-top:1px}
.wa-sheet button i{width:18px;height:18px;border-radius:50%;border:2px solid #8696a0;flex:0 0 auto}

/* behind-the-chat pipeline (dark glass) */
.pipeline-panel{align-self:center;padding:16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pp-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.pp-h b{display:block;font-size:.95rem}.pp-h small{display:block;font-size:.7rem;color:rgba(255,255,255,.6)}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:#25d366;box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:livep 1.8s infinite}
.pl{position:relative;display:flex;flex-direction:column;gap:5px}
.pl::before{content:"";position:absolute;left:21px;top:16px;bottom:16px;width:2px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05))}
.pl-step{position:relative;display:flex;align-items:flex-start;gap:11px;padding:8px 10px;border-radius:14px;border:1px solid transparent;color:rgba(255,255,255,.5);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.pl-n{position:relative;z-index:1;width:24px;height:24px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:800;background:#123a1a;border:1px solid rgba(255,255,255,.22);transition:all .3s}
.pl-step b{display:block;font-size:.82rem;color:rgba(255,255,255,.75)}
.pl-note{display:block;font-size:.7rem;line-height:1.35;margin-top:1px}
.pl-step.run{background:rgba(251,183,86,.12);border-color:rgba(251,183,86,.45);color:#ffe2a8}
.pl-step.run .pl-n{background:#fbb756;color:#2b1700;border-color:#fbb756;animation:pulse 1s infinite}
.pl-step.run b{color:#fff}
.pl-step.done{background:rgba(77,165,119,.14);border-color:rgba(77,165,119,.4);color:rgba(255,255,255,.85)}
.pl-step.done .pl-n{background:#25d366;border-color:#25d366;color:#05310f;font-size:0}
.pl-step.done .pl-n::after{content:"✓";font-size:.75rem}
.pl-step.done b{color:#fff}
.pl-step.warn{background:rgba(218,104,35,.16);border-color:rgba(218,104,35,.5);color:#ffd2b5}
.pl-step.warn .pl-n{background:#da6823;border-color:#da6823;color:#fff}
.pl-step.warn b{color:#fff}
#plResult:not(:empty){margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.18);animation:rise .4s ease-out}
.pl-route{display:flex;gap:11px;align-items:flex-start;margin-bottom:10px}
.pl-route small{display:block;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;color:#fbb756}
.pl-route b{display:block;font-size:.88rem;line-height:1.3}
.pl-route .avatar{width:40px;height:40px;font-size:.78rem}
.pl-route .chain .lv{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.85);font-size:.66rem;padding:4px 8px}
.pl-route .chain .lv.cur{background:#25d366;border-color:#25d366;color:#05310f}
.pl-route .chain i{color:rgba(255,255,255,.4)}
#plResult .btn.primary{background:linear-gradient(135deg,#fbb756,#da6823);color:#2b1700;border-color:transparent}
@media(max-width:1300px){.wa-stage{grid-template-columns:392px minmax(0,1fr)}.wa-left{grid-column:1/-1}.wa-feats{flex-direction:row;flex-wrap:wrap}.wa-feats>div{flex:1 1 220px}}
@media(max-width:860px){.wa-stage{grid-template-columns:1fr;padding:18px}.iphone{width:min(376px,100%)}}

/* ===================== FUTURE 2 · Apple / OpenAI-grade layer (emerald + Sakala saffron on ink) ===================== */
:root{
  --ink:#0b0b0c; --ink-2:#1d1d1f; --mute:#6e6e73; --mute-2:#86868b; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.12);
  --canvas:#f5f5f7; --surface:#ffffff;
  --em:#0e9f6e; --em-2:#16c784; --em-ink:#065f46; --em-soft:#e7f8f0;
  --saf:#f26b1d; --saf-2:#ff9a3c; --saf-soft:#fff2e8;
  --good:#12a150; --warn:#c88a04; --bad:#e5484d; --blue:#0a84ff; --violet:#7c5cff;
  --g:var(--em); --g-deep:var(--em-ink); --g-mid:var(--em-2); --g-soft:var(--em-soft);
  --sans:"Inter","Noto Sans Kannada","Noto Sans",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --serif:var(--sans);
  --r:20px; --sh:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05); --sh-h:0 2px 6px rgba(0,0,0,.05),0 20px 48px rgba(0,0,0,.09);
}
html,body{background:var(--canvas)}
body{color:var(--ink-2);font-feature-settings:"cv11","ss01","ss03";letter-spacing:-.011em}
::selection{background:rgba(14,159,110,.18)}

/* splash + AI transition: ink with a soft emerald / saffron glow */
.overlay,.go-overlay{background:radial-gradient(700px 420px at 50% 38%,rgba(22,199,132,.22),transparent 65%),radial-gradient(600px 380px at 62% 70%,rgba(242,107,29,.16),transparent 65%),#050506}
.overlay-text b{font-family:var(--sans);font-weight:600;letter-spacing:-.02em;font-size:1.5rem}
.overlay-text small{color:rgba(255,255,255,.55);letter-spacing:3px}
.halo::before{background:conic-gradient(from 0deg,rgba(255,255,255,.05),var(--em-2),rgba(255,255,255,.05),var(--saf-2),rgba(255,255,255,.05))}

/* header: frosted, quiet, precise */
.gov-header{background:rgba(255,255,255,.78);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
.gov-topbar{padding:10px 24px;gap:14px}
.logo-halo img,.logo-halo svg{height:38px;width:38px;border:none;background:#fff;box-shadow:0 0 0 1px var(--line)}
.gov-brand .logos{gap:6px}
.brand-divider{height:28px;background:var(--line-2)}
.gov-line1{font-size:.62rem;letter-spacing:1.6px;color:var(--mute-2);font-weight:600}
.gov-line2{font-family:var(--sans);font-weight:650;letter-spacing:-.025em;color:var(--ink);font-size:1.12rem}
.gov-line2 span{color:var(--ink);background:linear-gradient(90deg,var(--em),var(--em-2) 55%,var(--saf-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live-pill{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;letter-spacing:.3px;font-size:.68rem}
.live-pill i{background:var(--em-2)}
.clock{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--mute);padding:4px 5px 4px 14px}
.clock b{color:var(--ink);font-weight:600}
.clock button{border:none;background:var(--canvas);color:var(--ink-2);border-radius:999px;font-weight:600;padding:5px 11px;transition:background .15s}
.clock button:hover{background:var(--ink);color:#fff}
.lang-switch{border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang-switch button{border-radius:999px;background:none;color:var(--mute);padding:5px 12px}
.lang-switch button+button{border-left:none}
.lang-switch button.on{background:var(--ink);color:#fff}

/* the one bar we keep: slim ink strip, profile context only */
.app-bar{background:var(--ink);padding:8px 24px;min-height:34px;box-shadow:none}
.app-bar::before{display:none}
.app-bar-text{color:rgba(255,255,255,.62);font-size:.76rem;letter-spacing:.1px}
.app-bar-text b{color:#fff;font-weight:600}
.app-bar-text b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em-2);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px rgba(22,199,132,.22)}
.flag-rule,.ticker,.wf-tag,#engineTag,#aiBadge{display:none!important}

/* sidebar */
.sidebar-wrap{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border-right:1px solid var(--line)}
.side-h{font-family:var(--sans);font-size:.66rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute-2);font-weight:600}
.side-h::after{background:var(--line)}
.nav button{border-radius:12px;padding:9px 10px;color:var(--ink-2);font-weight:550;letter-spacing:-.01em}
.nav button:hover{background:rgba(0,0,0,.04);box-shadow:none;transform:none}
.nav button .ic{background:var(--canvas);color:var(--ink-2);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.nav button small{color:var(--mute)}
.nav button.on{background:var(--ink);color:#fff;box-shadow:0 8px 22px -10px rgba(0,0,0,.55)}
.nav button.on small{color:rgba(255,255,255,.62)}
.nav button.on .ic{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.nav .cnt{background:var(--canvas);color:var(--ink-2);font-weight:700}
.nav button.on .cnt{background:rgba(255,255,255,.14);color:#fff}
.nav .cnt.live{background:var(--em);color:#fff}
.side-note{background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--mute)}
.side-note b{color:var(--ink)}
.prof-switch{border-top:1px solid var(--line);background:transparent}
.prof-card:hover,.prof-card.open{border-color:var(--line);box-shadow:var(--sh)}
.prof-av{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line-2)}
.prof-menu{border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.35)}
.prof-menu h5{color:var(--mute-2);letter-spacing:1.2px}
.prof-item:hover{background:var(--canvas)} .prof-item.cur{background:var(--canvas)}
.prof-check{stroke:var(--em)}

/* main canvas */
.main{background:var(--canvas)}
.content{padding:22px 28px 64px}

/* page hero: ink, glow, big type (OpenAI-style) */
.head{background:#09090b;border-radius:26px;padding:28px 30px;box-shadow:0 30px 60px -36px rgba(0,0,0,.6)}
.head::before{background:radial-gradient(34% 60% at 18% 20%,rgba(22,199,132,.32),transparent 70%),radial-gradient(30% 55% at 82% 10%,rgba(242,107,29,.22),transparent 70%),radial-gradient(40% 60% at 60% 110%,rgba(10,132,255,.18),transparent 70%);filter:blur(18px)}
.head::after{opacity:.35}
.head h1{font-size:2.2rem;font-weight:650;letter-spacing:-.035em;line-height:1.08}
.head .eyebrow{color:rgba(255,255,255,.55);letter-spacing:2px;font-weight:600}
.head .sub{color:rgba(255,255,255,.62);font-size:.86rem}
.head .btn{border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.head .btn.primary{background:#fff;color:var(--ink);box-shadow:none}
.head .btn.primary:hover{filter:none;background:#e8e8ed}

/* cards & KPIs: white, quiet, generous */
.card,.kpi{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:var(--r);box-shadow:var(--sh)}
.card:hover{box-shadow:var(--sh-h)}
.card-h{border-bottom:1px solid var(--line);padding:16px 20px}
.card-h h3{font-weight:650;letter-spacing:-.02em;color:var(--ink);font-size:1rem}
.card-h h3::before{display:none}
.card-h .r{color:var(--mute)}
.card-b{padding:18px 20px}
.kpi{padding:18px 20px}
.kpi::before{height:0}
.kpi .l{color:var(--mute);font-weight:600;letter-spacing:.6px}
.kpi .v{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--ink);font-weight:650;letter-spacing:-.04em;font-size:2.15rem}
.kpi .d{color:var(--mute)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
.kpi.hero{background:#09090b!important;border-color:#09090b!important;animation:none}
.kpi.hero::after{background:radial-gradient(circle,rgba(22,199,132,.45),transparent 70%)}
.kpi.hero .v{color:#fff}
.kpi.hero .l,.kpi.hero .d{color:rgba(255,255,255,.6)}
.eyebrow{color:var(--mute-2)}

/* buttons: black pills */
.btn{border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:600;padding:9px 16px;letter-spacing:-.01em}
.btn:hover{background:var(--canvas);transform:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.btn.primary:hover{background:#2a2a2e;filter:none}
.btn.saffron{background:linear-gradient(135deg,var(--saf-2),var(--saf));border:none;color:#fff}
.btn.danger{color:var(--bad);border-color:rgba(229,72,77,.3)}
.chip{border-radius:999px;border-color:var(--line-2);background:#fff;color:var(--ink-2)}
.chip:hover{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:none}

/* badges, bars, tables */
.badge{font-weight:600;letter-spacing:.1px}
.b-g{background:#e8f7ee;color:#0b7a3d} .b-b{background:#e8f2ff;color:#0060df} .b-s{background:var(--saf-soft);color:#b4470c}
.b-n{background:var(--canvas);color:var(--mute)} .b-r{background:#ffecec;color:#c62f34} .b-w{background:#fff6e0;color:#8a5d00}
.hb .t{background:#eeeef1} .hb .t b{background:var(--c,var(--ink))}
.conf>b{background:linear-gradient(90deg,var(--em),var(--em-2))}
.sla .bar{background:#eeeef1}
th{background:#fafafa;color:var(--mute-2);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tbody tr:hover{background:#fafafb}
.path span{background:var(--canvas);border:1px solid var(--line);color:var(--ink-2);border-radius:999px}
.chain .lv{background:var(--canvas);border:1px solid var(--line);color:var(--ink-2);border-radius:999px}
.chain .lv.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.avatar{background:linear-gradient(135deg,var(--em-2),var(--em) 55%,var(--em-ink));box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line-2)}
.officer-card{background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.banner{border-radius:16px}
.banner.warn{background:#fff8e6;border:1px solid #f6e0a6;color:#6b4b00}
.banner.info{background:#eef6ff;border:1px solid #cfe3ff;color:#0a4a9e}
.quote{background:var(--canvas);border-left:3px solid var(--em);border-radius:0 14px 14px 0}
.timeline::before{background:var(--line-2)}
.tl::before{border-color:#fff}
.sec h4{color:var(--mute-2);letter-spacing:1.4px}
.toast{background:rgba(11,11,12,.92);border-left:none;border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.toast b{color:var(--em-2)}

/* drawer & modal */
.drawer{border-radius:24px 0 0 24px;box-shadow:-30px 0 80px -30px rgba(0,0,0,.35)}
.drawer-h{background:#fff;border-bottom:1px solid var(--line)}
.drawer-h h2,.modal-h h2{font-family:var(--sans);font-weight:650;letter-spacing:-.02em}
.drawer-h h2{color:var(--ink)}
.drawer-f{background:#fafafa;border-top:1px solid var(--line)}
.drawer-bg,.modal-bg{background:rgba(0,0,0,.28);backdrop-filter:blur(4px)}
.modal{border-radius:24px}
.modal-h{background:#09090b;border-radius:24px 24px 0 0}

/* AI mode: dark orb + gradient title */
.ai-hero h2{background:linear-gradient(90deg,var(--ink),var(--em) 60%,var(--saf));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2.1rem;letter-spacing:-.035em}
.ai-hero .orb{background:conic-gradient(from 0deg,var(--em-2),var(--blue),var(--violet),var(--saf-2),var(--em-2))}
.msg.q{background:var(--ink);border-radius:20px 20px 6px 20px}
.msg.a{border:1px solid var(--line);border-radius:20px 20px 20px 6px;box-shadow:var(--sh)}
.askbar form{border-radius:999px;padding:6px 6px 6px 14px;background:#fff;border:1px solid var(--line-2);box-shadow:0 18px 40px -18px rgba(0,0,0,.3)}
.dash-link{background:radial-gradient(120% 140% at 100% 0%,rgba(22,199,132,.32),transparent 55%),#09090b;border:1px solid rgba(255,255,255,.08);border-radius:18px}
.dash-ico i{background:linear-gradient(180deg,#a7f3d0,var(--em-2))}
.dash-go{background:rgba(22,199,132,.16);color:var(--em-2)}

/* WhatsApp stage: ink + glow, phone floats */
.wa-stage{background:#070708;border-radius:30px;box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.wa-stage::before{background:radial-gradient(26% 36% at 14% 24%,rgba(22,199,132,.28),transparent 70%),radial-gradient(24% 34% at 86% 18%,rgba(242,107,29,.22),transparent 70%),radial-gradient(30% 40% at 55% 100%,rgba(10,132,255,.2),transparent 70%)}
.wa-left h1{font-weight:650;letter-spacing:-.045em;font-size:2.6rem}
.wa-left h1 span{background:linear-gradient(90deg,#25d366,#7ef0b8 55%,var(--saf-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wa-left>p{color:rgba(255,255,255,.66)}
.wa-feats>div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px}
.wa-feats i{background:rgba(255,255,255,.06)}
.wa-qr{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.iphone{box-shadow:0 0 0 2px #3a3a3c,0 0 0 4px #121214,0 60px 100px -40px rgba(0,0,0,.9),0 0 140px -30px rgba(22,199,132,.35)}
.pipeline-panel{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:26px}
.pl-step.run{background:rgba(242,107,29,.12);border-color:rgba(255,154,60,.45)}
.pl-step.run .pl-n{background:var(--saf-2);border-color:var(--saf-2)}
.pl-step.done{background:rgba(22,199,132,.1);border-color:rgba(22,199,132,.32)}
.pl-step.done .pl-n{background:var(--em-2);border-color:var(--em-2)}
.pl-route small{color:var(--saf-2)}
.pl-route .chain .lv.cur{background:var(--em-2);border-color:var(--em-2);color:#04261a}
#plResult .btn.primary{background:#fff;color:var(--ink)}

/* map hero */
.map-hero{border-radius:26px!important}
.kmap{border-radius:20px;background:radial-gradient(70% 80% at 55% 45%,#fff,rgba(255,255,255,0) 70%),radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 1.4px) 0 0/18px 18px,#f2f2f5}
.kmap-side,.crumbs,.kmap-btns{border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh)}
.crumbs b{color:var(--em)}

/* new intelligence screens */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.stat-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.stat-row:last-child{border-bottom:none}
.stat-row b{font-variant-numeric:tabular-nums;color:var(--ink)}
.stat-row small{display:block;color:var(--mute);font-size:.72rem;margin-top:2px}
.ai-note{margin-top:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#f3fbf7,#fff7f0);border:1px solid var(--line);font-size:.84rem;line-height:1.6}
.ai-note .tag{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--em-ink);margin-bottom:6px}
.ai-note .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--em-2)}
.big-num{font-size:2.6rem;font-weight:650;letter-spacing:-.05em;color:var(--ink);line-height:1}
.big-num small{font-size:.8rem;color:var(--mute);letter-spacing:0;font-weight:500;margin-left:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--em-2),var(--em));min-height:3px}
.flag-li{padding:10px 12px;border-radius:14px;background:#fff8f3;border:1px solid #ffd9bf;margin-bottom:8px;font-size:.8rem}
.flag-li b{color:#b4470c}
.drop{border:1.5px dashed var(--line-2);border-radius:20px;padding:28px;text-align:center;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--em);background:#f7fdfa}
.loading{display:inline-flex;gap:4px;align-items:center;color:var(--mute);font-size:.8rem}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.prod-card{padding:16px;border-radius:18px;border:1px dashed var(--line-2);background:#fff;font-size:.8rem;color:var(--mute)}
.prod-card b{display:block;color:var(--ink);font-size:.9rem;margin-bottom:4px}
.dash-link.on{box-shadow:0 0 0 2px var(--em-2),0 16px 32px -12px rgba(0,0,0,.5)}
.kmap-hint{background:rgba(11,11,12,.82);backdrop-filter:blur(8px)}
.prof-txt b{color:var(--ink)}
.kmap-side h6,.kmap-side .kleg{color:var(--mute)}
.pl-step,.pl-n{transition:background .25s,border-color .25s,color .25s}

/* officer → citizen messages inside WhatsApp */
.wa-row.officer .wa-bub{border-left:3px solid var(--em);background:#f1fbf5}
.wa-row.officer .wa-bub::before{border-right-color:#f1fbf5}
.wa-off{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid rgba(14,159,110,.18)}
.wa-off-av{width:26px;height:26px;border-radius:50%;background:var(--em);display:grid;place-items:center;font-size:.8rem;flex:0 0 auto}
.wa-off b{display:block;font-size:.8rem;color:var(--em-ink)}
.wa-off small{display:block;font-size:.64rem;color:#54656f}
@keyframes waPing{0%{transform:translateY(0)}20%{transform:translateY(-6px)}40%{transform:translateY(0)}60%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.iphone.ping{animation:waPing .6s ease}

/* ===== WhatsApp stage: always fits the window at 100% zoom (no page scroll, phone fully visible, columns top-aligned) ===== */
:root{--hdr:96px;--wa-pad:16px}
.content.wa-mode{max-width:none;height:100%;min-height:0;display:flex;flex-direction:column;padding:12px 16px;animation:none}
.content.wa-mode .wa-stage{--ph:clamp(420px,calc(100dvh - var(--hdr) - 24px - 2*var(--wa-pad)),820px);
  flex:1 1 auto;min-height:0;height:auto;padding:var(--wa-pad) clamp(16px,2vw,30px);border-radius:26px;
  grid-template-columns:minmax(250px,1fr) auto minmax(290px,1fr);grid-template-rows:var(--ph);align-items:start;gap:clamp(16px,2.2vw,36px)}
.content.wa-mode .iphone{height:var(--ph);width:auto;aspect-ratio:400/790;max-width:390px;align-self:start;justify-self:center;border-radius:52px}
.content.wa-mode .wa-left,.content.wa-mode .pipeline-panel{align-self:start;max-height:var(--ph);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.content.wa-mode .wa-left::-webkit-scrollbar,.content.wa-mode .pipeline-panel::-webkit-scrollbar{display:none}
.content.wa-mode .wa-left{padding-top:6px}
.content.wa-mode .wa-left h1{margin:6px 0 10px;font-size:clamp(1.9rem,4.2vh,2.6rem)}
.content.wa-mode .wa-left>p{font-size:clamp(.82rem,1.75vh,.92rem);margin:0 0 clamp(10px,2vh,18px)}
.content.wa-mode .wa-feats{gap:clamp(6px,1.1vh,10px)}
.content.wa-mode .wa-feats>div{padding:clamp(8px,1.3vh,11px) 12px}
.content.wa-mode .wa-qr{margin-top:clamp(8px,1.6vh,16px)}
.content.wa-mode .pipeline-panel{padding:14px}
.content.wa-mode .pl{gap:clamp(3px,.6vh,5px)}
.content.wa-mode .pl-step{padding:clamp(5px,.9vh,8px) 10px}
.content.wa-mode .wa-head{padding:4px 12px 8px 6px}
@media (max-height:820px){
  .content.wa-mode .wa-feats span{font-size:.72rem}
  .content.wa-mode .pl-note{font-size:.66rem}
  .content.wa-mode .pp-h{margin-bottom:8px}
  .content.wa-mode .ios-status{height:40px}
}
@media (max-height:760px){ .content.wa-mode .wa-qr{display:none} }
@media (max-height:680px){ .content.wa-mode .wa-feats>div:nth-child(n+3){display:none} .content.wa-mode .pl-note{display:none} }
@media (max-width:1280px){
  .content.wa-mode .wa-stage{grid-template-columns:auto minmax(280px,1fr)}
  .content.wa-mode .wa-left{display:none}
}
@media (max-width:860px){
  .content.wa-mode{height:auto}
  .content.wa-mode .wa-stage{grid-template-columns:1fr;grid-template-rows:auto}
  .content.wa-mode .pipeline-panel{max-height:none}
}

.content.wa-mode .pl-basis{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-height:760px){ .content.wa-mode .wa-bub{font-size:.8rem} .content.wa-mode .wa-btns button{padding:7px 10px;font-size:.8rem} }
.content.wa-mode .island{width:30%;height:clamp(22px,3.4vh,31px);top:clamp(6px,1vh,9px)}
.content.wa-mode .ios-status{padding:4px 7% 0 9%;font-size:clamp(.74rem,1.6vh,.9rem)}
.content.wa-mode .wa-title b{font-size:clamp(.86rem,1.9vh,1rem);white-space:nowrap}
.content.wa-mode .wa-av{width:clamp(30px,4.6vh,38px);height:clamp(30px,4.6vh,38px)}
.content.wa-mode .wa-hic{margin-left:4px}

/* official Sakala logo (vector redraw of sakala.kar.nic.in/img/Sakala_logo.jpg) */
.sk-logo{display:block;object-fit:contain;background:#fff}
.halo .sk-logo{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;padding:9px;animation:popIn .7s ease-out .12s both}
.logo-halo .sk-logo{height:40px;width:40px;border-radius:50%;padding:3px;box-shadow:0 0 0 1px var(--line)}
.wa-av .sk-logo{width:100%;height:100%;border-radius:50%;padding:2px}

/* ===== MAP 2026: single-hue saffron choropleth, emerald pilot, glass controls ===== */
.kmap{border-radius:22px;border:1px solid var(--line);background:
  radial-gradient(55% 65% at 58% 42%,#ffffff,rgba(255,255,255,0) 70%),
  radial-gradient(circle at 1px 1px,rgba(15,23,42,.07) 1px,transparent 1.5px) 0 0/16px 16px,
  linear-gradient(180deg,#f8f9fb,#eef1f5)}
.ko{fill:#0b0b0c;stroke:#0b0b0c}
.kd{stroke:#ffffff;stroke-width:calc(var(--sw) * 1.25);stroke-opacity:1;transition:fill .3s,filter .25s}
.kd:hover{filter:brightness(.96) saturate(1.25)}
.kd-hl{fill:#e3f8ee!important;stroke:#0e9f6e;stroke-width:calc(var(--sw) * 2.2);filter:drop-shadow(0 0 calc(var(--sw) * 7) rgba(22,199,132,.55))}
.kd-hl:hover{fill:#d3f4e4!important}
.kmap.moving .kd-hl{filter:none}
.kdl{fill:#64748b;font-weight:600;letter-spacing:.01em}
.kdl-hl{fill:#065f46;font-weight:700}
.kt{fill-opacity:.3;stroke-width:calc(var(--sw) * 1.8)}
.kt:hover{fill-opacity:.45}
.kt.on{fill-opacity:.16;stroke-width:calc(var(--sw) * 2.6)}
.ktl{fill:#0b0b0c;font-weight:700;stroke:rgba(255,255,255,.95)}
.km-dot{stroke:#fff;stroke-width:calc(var(--sw) * 2.4)}
.km-n{font-weight:700}
.kdot{stroke:#fff}
.kdot:hover{stroke:#0b0b0c}
.kmap-side{background:rgba(255,255,255,.76);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid rgba(0,0,0,.06);border-radius:20px;box-shadow:0 24px 48px -28px rgba(0,0,0,.35);padding:12px}
.kmap-side h6{color:var(--mute-2);font-weight:600;letter-spacing:1.3px}
.ktk{border-radius:14px;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9)}
.ktk:hover{box-shadow:0 8px 20px -10px rgba(0,0,0,.25);border-color:var(--s)}
.ktk.on{border-color:var(--s);box-shadow:0 0 0 3px color-mix(in srgb,var(--f) 25%,transparent)}
.ktk i{width:10px;height:10px;border-radius:50%;background:var(--f);box-shadow:0 0 0 3px color-mix(in srgb,var(--f) 22%,transparent)}
.ktk b,.ktk em{color:var(--ink)}
.kleg{color:var(--mute)}
.kscale b{height:8px;background:linear-gradient(90deg,rgb(246,244,241),rgb(252,234,216),rgb(250,204,163),rgb(246,162,108),rgb(229,102,42));box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.crumbs,.kmap-btns{background:rgba(255,255,255,.76);backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06);border-radius:14px}
.crumbs b{color:var(--em)}
.kmap-btns button{color:var(--ink);font-weight:600;border-radius:10px}
.kmap-btns button:hover{background:rgba(0,0,0,.05)}
.kmap-tip{background:rgba(11,11,12,.86);backdrop-filter:blur(12px);border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.kmap-tip b{color:var(--em-2)}
.kmap-attr{background:rgba(255,255,255,.6);color:var(--mute-2);border-radius:999px;padding:2px 9px}

/* ===== AI MODE 2026: logo hero, big suggestion cards, chat scrolls inside, ask bar pinned to the bottom ===== */
.main.ai-bg{background:
  radial-gradient(900px 520px at 12% 0%,rgba(22,199,132,.13),transparent 60%),
  radial-gradient(760px 480px at 92% 8%,rgba(242,107,29,.11),transparent 62%),
  radial-gradient(900px 600px at 50% 110%,rgba(10,132,255,.07),transparent 60%),var(--canvas)}
.main.ai-bg::after{content:"";position:fixed;right:-40px;bottom:-60px;width:520px;height:420px;pointer-events:none;opacity:.055;
  background:url("assets/sakala-logo.svg") no-repeat center/contain;filter:grayscale(.2)}
.content.ai-mode{height:100%;min-height:0;display:flex;flex-direction:column;padding:16px 28px 18px;animation:none;max-width:none}
.ai-wrap{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1040px;width:100%;margin:0 auto}
.ai-hero{padding:14px 10px 6px;flex:0 0 auto}
.ai-logo{width:92px;height:92px;margin:0 auto 12px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 1px var(--line),0 24px 48px -22px rgba(0,0,0,.35),0 0 80px -20px rgba(22,199,132,.45);animation:aiFloat 5s ease-in-out infinite}
.ai-logo .sk-logo{width:72px;height:72px;padding:4px}
@keyframes aiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ai-hero h2{font-size:2.3rem}
.ai-hero p{font-size:.92rem;max-width:620px;margin:8px auto 0;color:var(--mute)}
.suggest{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:18px 0 10px;flex:0 0 auto}
.sq{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--line);
  font-size:1rem;font-weight:550;line-height:1.35;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s}
.sq:hover{transform:translateY(-2px);box-shadow:var(--sh-h);border-color:rgba(14,159,110,.45)}
.sq-ic{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#e7f8f0,#fff2e8);color:var(--em);font-size:.95rem}
.chatlog{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;gap:14px;margin:4px 0 0;padding:6px 4px 18px;scrollbar-width:thin}
.chatlog:empty{flex:1 1 auto}
.msg.a{font-size:.95rem;line-height:1.6;padding:16px 20px;width:auto;max-width:88%}
.msg.q{font-size:.95rem;padding:12px 18px}
.msg .src{display:none}
.askbar{position:static;flex:0 0 auto;padding:10px 0 0;background:none}
.askbar form{box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:7px 7px 7px 18px}
.askbar input{font-size:1rem;padding:11px 8px}
.askbar .btn.tool{border:none;background:var(--canvas);color:var(--ink);border-radius:999px;width:42px;height:42px;padding:0;display:grid;place-items:center}
.askbar .btn.tool.rec{background:#e5484d;color:#fff;animation:pulse 1s infinite}
.askbar .btn.primary{height:42px}
.suggest-mini{display:none;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:0 6px}
.suggest-mini .chip{font-size:.78rem;padding:7px 13px}
.ai-wrap.has-chat .ai-hero{padding:6px 10px 0;display:flex;align-items:center;gap:14px;text-align:left}
.ai-wrap.has-chat .ai-logo{width:46px;height:46px;margin:0;animation:none;box-shadow:0 0 0 1px var(--line)}
.ai-wrap.has-chat .ai-logo .sk-logo{width:36px;height:36px;padding:2px}
.ai-wrap.has-chat .ai-hero h2{font-size:1.25rem;margin:0}
.ai-wrap.has-chat .ai-hero p{display:none}
.ai-wrap.has-chat .suggest{display:none}
.ai-wrap.has-chat .suggest-mini{display:flex}
@media (max-height:760px){ .ai-logo{width:72px;height:72px} .ai-logo .sk-logo{width:56px;height:56px} .ai-hero h2{font-size:1.9rem} .sq{padding:12px 14px;font-size:.92rem} }

/* ===== AI-mode charts (Chart.js, ported from the RDPR renderer) ===== */
.msg.a.has-chart{width:min(880px,94%);max-width:none}
.chart-card{margin-top:14px;background:linear-gradient(180deg,#fff,#fbfcfb);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 14px 34px -22px rgba(0,0,0,.28);animation:chartIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes chartIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.chart-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-title{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:650;color:var(--ink);letter-spacing:-.01em}
.chart-title small{color:var(--mute);font-weight:500}
.chart-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--em-2),var(--saf-2));box-shadow:0 0 0 3px rgba(22,199,132,.15)}
.chart-toggle{position:relative;isolation:isolate;margin-left:auto;display:inline-flex;padding:3px;border-radius:999px;background:var(--canvas);border:1px solid var(--line)}
.chart-toggle .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--ink);box-shadow:0 4px 12px -4px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.chart-toggle.no-anim .thumb{transition:none}
.chart-toggle button{position:relative;z-index:1;background:transparent;border:none;color:var(--mute);font-size:.74rem;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;transition:color .25s}
.chart-toggle button:hover{color:var(--ink)}
.chart-toggle button[aria-pressed="true"]{color:#fff;cursor:default}
.chart-canvas{height:280px;position:relative}
.chart-canvas canvas{width:100%!important;height:100%!important}
.chart-canvas svg{width:100%;height:100%} .chart-canvas svg text{fill:var(--mute);font-size:11px}
.chart-layer{position:absolute;inset:0;opacity:0;transform:scale(.985);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.chart-layer.on{opacity:1;transform:none} .chart-layer.off{opacity:0;transform:scale(.97);pointer-events:none}
.chart-foot{margin-top:8px;font-size:.68rem;color:var(--mute-2)}

.ko{fill:#ffffff;stroke:#ffffff;stroke-width:calc(var(--sw) * 7);stroke-linejoin:round}

.kd{stroke:rgba(255,255,255,.95);stroke-width:calc(var(--sw) * 1.35);stroke-linejoin:round;cursor:pointer;transition:fill .35s ease,filter .2s ease,stroke-width .2s ease}
.kd:hover,.kd.hot{filter:brightness(1.06) saturate(1.15) drop-shadow(0 calc(var(--sw) * 5) calc(var(--sw) * 7) rgba(150,20,30,.38));stroke:#fff;stroke-width:calc(var(--sw) * 2.6)}
.kd-hl{fill:#dff7ec!important;stroke:#0e9f6e;stroke-width:calc(var(--sw) * 2.4);filter:drop-shadow(0 0 calc(var(--sw) * 8) rgba(22,199,132,.6))}
.kd-hl:hover{fill:#cdf2e1!important}
.kmap.moving .kd,.kmap.moving .kd:hover,.kmap.moving .kd.hot,.kmap.moving .kd-hl{filter:none}
.kdl{fill:#3b2a1a;font-weight:600;opacity:.85}
.kscale b{background:linear-gradient(90deg,rgb(255,246,214),rgb(255,226,128),rgb(255,205,0),rgb(255,159,67),rgb(240,85,58),rgb(200,16,46))}
.kmap-tip .tip-big{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:-.01em;margin:2px 0}
.kmap-tip .tip-big small{font-size:.66rem;font-weight:500;color:rgba(255,255,255,.65)}
.kmap-tip b{color:#ffd84d}

/* fade the context when zoomed into the pilot (opDots rises from 0 at state level to 1 at taluk level) */
.kd:not(.kd-hl){fill-opacity:calc(1 - var(--opDots) * .55)}
.kscale b{background:linear-gradient(90deg,rgb(255,247,220),rgb(255,230,140),rgb(255,210,60),rgb(255,163,72),rgb(240,88,60),rgb(200,16,46))}

/* ===== MAP category tiles: On time / Overdue / Vulnerable (filter + fly + list) ===== */
.kmap-side{width:236px;max-height:calc(100% - 76px);overflow-y:auto;scrollbar-width:none}
.kmap-side::-webkit-scrollbar{display:none}
.kcats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 9px 8px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(0,0,0,.06);background:#fff;text-align:left;transition:transform .18s,box-shadow .2s,border-color .2s,background .2s;overflow:hidden}
.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.kc b{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kc small{font-size:.62rem;font-weight:600;color:var(--mute);letter-spacing:.2px}

.kc.on{background:var(--c);border-color:var(--c);box-shadow:0 12px 26px -10px color-mix(in srgb,var(--c) 70%,transparent)}
.kc.on b,.kc.on small{color:#fff}
.kc.on::before{background:rgba(255,255,255,.5)}
.kc-list{display:none;flex-direction:column;gap:4px;margin-top:2px;max-height:210px;overflow-y:auto;scrollbar-width:thin;animation:rise .3s ease-out}
.kc-list.on{display:flex}
.kc-list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:11px;border:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.85);cursor:pointer;transition:background .15s,transform .15s}
.kc-list button:hover{background:#fff;transform:translateX(2px)}
.kc-list span{flex:1;min-width:0}
.kc-list b{display:block;font-size:.74rem;color:var(--ink)}
.kc-list small{display:block;font-size:.62rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-list em{font-style:normal;font-size:.64rem;font-weight:700;color:#0b7a3d;white-space:nowrap}
.kc-list em.bad{color:#c62f34}
.kc-more{font-size:.66rem;color:var(--mute);padding:4px 2px}
/* filtering: the other dots step back, the chosen ones grow and pulse */
.kmap.f-ontime .kdot:not([data-t]),.kmap.f-overdue .kdot:not([data-o]),.kmap.f-vulnerable .kdot:not([data-v]){opacity:.07;pointer-events:none}

.kmap.f-vulnerable .kdot[data-v]{fill:#d6409f!important}
@keyframes kdotPulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.kmap.moving .kdot{animation:none}

/* ---------------- simulated AI: understand + route ---------------- */
function understand(text){
  const t = text.toLowerCase();
  const has = (...w) => w.some(x => /^[a-z ]+$/.test(x) ? new RegExp('(^|[^a-z])'+x+'([^a-z]|$)').test(t) || (x.length>5 && t.includes(x)) : t.includes(x));
  let r = null;
  if (has('rti','information act')) return {type:'WRONG_DOOR', reason:'This is an RTI request, which iPGRS does not treat as a grievance. File it on RTI Online.'};
  if (has('power','electric','current','ವಿದ್ಯುತ್','transformer')) return {type:'OUT_OF_SCOPE', dept:'Energy Department', line:'CESC Mysuru (Chamundeshwari Electricity Supply Corp.)', conf:.9, reason:'Mentions a power cut. In Mysuru district this belongs to CESC (Energy), which is outside the 3 pilot departments.'};

      const fromK=c.owner, from=OFF[c.owner].short, to=OFF[c.owner].up;
      c.levelSince = new Date(+c.levelSince + SLA[c.level]*DAY);
      c.owner=to; c.level=OFF[to].lv; esc++;
      c.history.push({t:new Date(c.levelSince),who:'System',what:`Auto-escalated to ${OFF[to].short}`,c:'#c8372d',note:`${from} did not act within ${SLA[OFF[fromK].lv]} days (assumed SLA). Notice sent to both officers.`});
    }

async function handleFree(text, viaVoice=false, viaImage=false){
  if (!viaVoice && !viaImage) userSay(text);
