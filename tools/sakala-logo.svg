<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 172" role="img" aria-label="Sakala · No more delays… We deliver on time">
  <title>Sakala</title>
  <defs>
    <!-- text paths around the clock face (centre 105,70) -->
    <path id="sakArcTop" d="M 55.6 52.2 A 52.5 52.5 0 0 1 145.2 36.3"/>
    <path id="sakArcBot" d="M 96.8 126.6 A 57 57 0 0 0 161.8 65"/>
    <linearGradient id="sakFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbc944"/><stop offset="1" stop-color="#f1a81d"/></linearGradient>
    <linearGradient id="sakWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9652d"/><stop offset="1" stop-color="#7c4216"/></linearGradient>
    <linearGradient id="sakHandle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5602a"/><stop offset="1" stop-color="#774013"/></linearGradient>
  </defs>
  <!-- wooden sound block -->
  <rect x="38" y="152" width="160" height="10" rx="2" fill="url(#sakWood)"/>
  <rect x="92" y="140" width="72" height="13" rx="2" fill="url(#sakWood)"/>
  <rect x="99" y="133" width="58" height="9" rx="4.5" fill="#b9753c"/>
  <!-- gavel handle -->
  <path d="M 70 103 L 22 156" stroke="url(#sakHandle)" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M 30 147 L 36 140" stroke="#e9b57f" stroke-width="12.5" opacity=".6"/>
  <!-- red rim of the gavel head, seen in perspective -->
  <circle cx="92" cy="81" r="40" fill="#d8262e"/>
  <!-- clock face -->
  <circle cx="105" cy="70" r="40" fill="url(#sakFace)" stroke="#fde6a3" stroke-width="2.2"/>
  <!-- hands at about 10:10 -->
  <path d="M 105 70 L 84 54" stroke="#121212" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M 105 70 L 127 45" stroke="#121212" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="105" cy="70" r="4.6" fill="#121212"/>
  <!-- curved tagline -->
  <text font-family="'Segoe Print','Comic Sans MS','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#c3232b">
    <textPath href="#sakArcTop">No more delays ...</textPath></text>
  <text font-family="'Segoe Print','Comic Sans MS','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c3232b">
    <textPath href="#sakArcBot">We deliver on time</textPath></text>
</svg>
