<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitra</title>
<link rel="icon" href="/assets/sakala-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search),i=1;var t="light";try{localStorage.removeItem("jv_theme");t=sessionStorage.getItem("jv_theme")||"light"}catch(e){}d.dataset.theme=t;try{if(sessionStorage.getItem("jv_intro")&&q.get("intro")!=="1")i=0;sessionStorage.setItem("jv_intro","1")}catch(e){}if(q.get("intro")==="0"||q.get("auto")||matchMedia("(prefers-reduced-motion: reduce)").matches)i=0;d.dataset.intro=i?"1":"0";if(q.has("app"))d.classList.add("inapp")})()</script>
<link rel="stylesheet" href="/mitra.css?v=78">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="grid"></div></div>

<header class="top">
  <div class="brand">
    <div class="halo"><img src="/assets/sakala-logo.svg" alt=""></div>
    <div class="brand-t"><b><span class="grad">Mitra</span></b><span>Government of Karnataka · Praja Seva Department</span></div>
  </div>
  <div class="hdr-right">
    <div class="bellwrap"><button class="bell" id="bell" title="Notifications"><svg viewBox="0 0 24 24"><path d="M12 22a2.4 2.4 0 0 0 2.4-2.2H9.6A2.4 2.4 0 0 0 12 22zm6.6-6.2V11a6.6 6.6 0 0 0-5-6.4V4a1.6 1.6 0 0 0-3.2 0v.6a6.6 6.6 0 0 0-5 6.4v4.8L3.6 17.6v1h16.8v-1z"/></svg><b id="bellN" hidden>0</b></button>
      <div class="ncenter" id="ncenter"><div class="nc-h"><span>Notifications</span><button id="ncClear">Mark all read</button></div><div class="nc-l" id="ncList"></div></div></div>
    <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="kn">ಕನ್ನಡ</button></div>
    <button class="theme" id="theme" title="Switch to light mode" aria-label="Theme"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div class="clock" id="clock" title="Demo clock">—</div>
    <div class="status" id="status" title="Engines"><span class="dot"></span><span id="statusText">connecting</span></div>
  </div>
</header>

<main class="stage">
  <section class="col left" id="left"></section>

  <section class="col center">
    <div class="orb-wrap">
      <canvas id="orb" width="520" height="520"></canvas>
      <div class="mode-pill" id="modePill" data-m="standby"><i></i><b>Standby</b><span class="lat" id="latency"></span></div>
      <div class="dmeter you" aria-hidden="true"><i></i><span>you</span></div><div class="dmeter me" aria-hidden="true"><i></i><span>Mitra</span></div>
      <div class="orb-state" id="state"><span class="k">idle</span><span class="v" id="stateText">Press Start</span></div>
    </div>
    <div class="captions">
      <div class="you" id="capYou"></div>
      <div class="jv" id="capJv"></div>
    </div>
    <canvas class="wave" id="wave" width="640" height="36" aria-hidden="true"></canvas>
    <div class="trace" id="trace">
      <span data-k="listen"><i></i>Listen</span><span data-k="hear"><i></i>Hear</span><span data-k="think"><i></i>Understand</span><span data-k="act"><i></i>Act on iPGRS</span><span data-k="speak"><i></i>Speak</span>
    </div>
    <div class="composer">
      <button class="mic" id="mic" aria-label="Microphone" data-tip="Tap to mute · hold to talk (or hold Space)"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg></button>
      <button class="attach" id="attach" title="Upload a written complaint (PDF or photo)" aria-label="Upload a written complaint" hidden><svg viewBox="0 0 24 24"><path d="M21.4 11.6 12.3 20.7a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.1a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
      <button class="stop" id="stop" title="Stop (Esc, or say “stop”)"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
      <div class="field"><input id="text" placeholder="…or type what you would say, then Enter" autocomplete="off" spellcheck="false"><button id="send" title="Send">↵</button></div>
      <button class="hf on" id="handsfree" title="Wake word: say “Hey Mitra” any time"><span class="ring"></span><span id="wakeLabel">“Hey Mitra”</span></button>
    </div>
    <div class="hints" id="hints"></div>
  </section>

  <section class="col right" id="right"></section>
</main>

<footer class="feed" id="feed">
  <div class="prof" id="prof">
    <button class="prof-btn" id="profBtn" title="Switch profile"><span class="av" id="profAv">👤</span><span class="prof-t"><b id="profName">Citizen</b><span id="profSub">Mitra</span></span><svg class="car" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg></button>
    <div class="prof-menu" id="profiles">
      <div class="pm-h">Switch profile</div>
      <button data-p="citizen"><i>👤</i><span><b>Citizen</b><small>Speak a complaint or a request; it is filed and routed</small></span></button>
      <button data-p="officer"><i>🧑‍💼</i><span><b>Officer</b><small>Inbox, reports and decisions by voice</small></span></button>
      <div class="officer-pick" id="officerPick" hidden><label>Logged in as</label><select id="officerSel" title="Log in as"></select></div>
      <button data-p="cs"><i>🏛️</i><span><b>Chief Secretary</b><small>Position, overdue, nudges, Wednesday pack</small></span></button>
      <button class="teach forget" id="forgetBtn"><i>🧹</i><span><b>Forget this conversation</b><small>Delete what was said on this screen</small></span></button>
      <button class="teach" id="teach"><i>🎙</i><span><b>Teach Mitra your voice</b><small>Say its name three times so it always recognises you</small></span></button>
    </div>
  </div>
  <div class="feed-h"><span class="pulse"></span>Live across all three screens</div><div class="feed-l" id="feedList"></div>
</footer>
<div id="toasts"></div>
<div id="notifs" aria-live="polite"></div>

<div id="splash">
  <div class="sp-floor" aria-hidden="true"><canvas id="spMap"></canvas></div>
  <div class="sp-vignette" aria-hidden="true"></div>
  <canvas id="spOrb" aria-hidden="true"></canvas>
  <div class="sp-card">
    <div class="sp-halo"><svg class="sp-trace" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="57"/></svg><img src="/assets/sakala-logo.svg" alt=""></div>
    <h1 id="spTitle"><span class="grad">Mitra</span></h1>
    <div class="sp-greet" id="spGreet"></div>
    <div class="sp-row">
      <button class="sp-start" id="start"><svg class="sw" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sw">Start web</span><span class="sa">Start</span></button>
      <button class="sp-start sp-app" id="startApp"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></svg><span>Start app</span></button>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script src="/assets/vendor/chart.umd.min.js"></script>
<script src="/orb.js?v=47"></script>
<script src="/portal.js?v=33"></script>
<script src="/assets/mapdata.js?v=2"></script>
<script src="/stage.js?v=68"></script>
<script src="/splash.js?v=52"></script>
<script src="/phone.js?v=50"></script>
<script src="/mitra.js?v=79"></script>
<script src="/app.js?v=47"></script>
</body>
</html>
