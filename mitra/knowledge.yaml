- id: gsc
  topic: GSC number
  ask: [gsc number, gsc, what is a gsc, acknowledgment number, acknowledgement number, sakala number, application number, sk number]
  keys: [gsc, acknowledgment]
  say: >-
    A GSC number is the Sakala acknowledgment of an application. GSC stands for Guarantee of Services to Citizens, the Act's
    original name, and the number lets anyone track the application and its legal deadline.
  more: >-
    The format is two or three letters, three digits, a letter and nine or ten digits. If a citizen quotes one in a grievance,
    Mitra links the grievance to that application and can tell a payment problem apart from a Sakala delay.
  source: Sakala portal
  related: [sakala, grievance_vs_sakala]

- id: ipgrs
  topic: iPGRS
  ask: [what is ipgrs, ipgrs, i p g r s, janaspandana, jana spandana, public grievance redressal, grievance portal, grievance system, pgrs]
  keys: [ipgrs, janaspandana]
  say: >-
    iPGRS is Karnataka's Integrated Public Grievance Redressal System, also called Janaspandana. It has been live since
    1 November 2021, takes a grievance from any channel and sends it to the field officer responsible for that place.
  more: >-
    It was set up under a High Court order of 2017 and a DPAR government order. The content is owned by the Centre for
    e-Governance and the system was built by the Centre for Smart Governance, hosted at the State Data Centre. Its State Level
    Review Committee is chaired by the Chief Secretary. The helpline is 1902. iPGRS 2.0 was announced in June 2026.
  source: negd.gov.in state directory 407 and 418; ipgrs.karnataka.gov.in
  related: [ipgrs_routing, ipgrs_exclusions, ipgrs_helpline, grievance_vs_sakala]

