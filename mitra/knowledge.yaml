- id: officer_ladder
  topic: Officers and their seniors
  ask: [who is above the tahsildar, who is above the pdo, hierarchy, officer hierarchy, ladder, who is the senior, chain of officers, who is the l2, who is the l3, tahsildar, pdo, executive officer, zp ceo, deputy commissioner, assistant commissioner]
  keys: [hierarchy, ladder, senior, above, tahsildar, pdo]
  say: >-
    For Revenue the ladder is Tahsildar, then the Assistant Commissioner, then the Deputy Commissioner. For Rural Development it
    is the PDO, engineer or water engineer, then the Taluk Panchayat Executive Officer, then the Zilla Panchayat CEO. For Food it
    is the Food Inspector, the Deputy Director of Food and the Deputy Commissioner.
  more: >-
    Survey matters go from the Assistant Director of Land Records to the Deputy Director and the Deputy Commissioner. A
    grievance that is not acted on moves up this ladder by itself.
  source: iPGRS officer master, Mysuru
  related: [escalation, pilot, ipgrs_routing]

- id: escalation
  topic: Escalation and deadlines
  ask: [escalation, how many days does the officer have, deadline, deadlines, what if the officer does nothing, officer does nothing, nobody acts, no action is taken, what happens if nothing happens, auto escalation, automatic escalation, reminders, how long does the officer, time limit, days to act]
  keys: [escalation, deadline, days, reminder]
  say: >-
    Every case has a clock. In this demo an L1 officer gets 7 days, L2 gets 5 and L3 gets 3, which is an assumption because the
    real per-level limits are not public. Reminders go out before the deadline, and if nothing happens the case moves up to the senior by itself.
  more: >-
    If a citizen says a resolved problem is not actually solved, the case re-opens and climbs one rung with a fresh clock. Sakala
    applications follow their own legal clock, for example 21 days for a caste certificate, with compensation when it is breached.
  source: Sakala AI POC (SLA days assumed); iPGRS
  related: [ipgrs_routing, officer_ladder, sakala_compensation]

- id: grievance_vs_sakala
  topic: Grievance versus Sakala application
  ask: [difference between grievance and sakala, grievance or application, is my complaint a sakala matter, sakala or ipgrs, what is the difference, two ladders]
  keys: [difference, versus, grievance, application]
  say: >-
    A grievance is a complaint that something is wrong, like no water or a broken street light; it goes to the field officer
    through iPGRS. A Sakala application asks for a service, like a caste certificate or a ration card; it has a legal deadline
    and compensation for delay. The two ladders are kept apart and never mixed.
  source: Sakala Act; iPGRS
  related: [sakala, ipgrs, sakala_appeal]

- id: privacy
  topic: Privacy
  ask: [privacy, is my data safe, is my number safe, my phone number safe, personal data, do you store my phone number, do you keep my number, masking, masked, aadhaar, what happens to my number, data protection, confidential]
  keys: [privacy, safe, masked, aadhaar, personal, confidential]
  say: >-
    Phone numbers, Aadhaar numbers, emails and card numbers are masked before anything reaches the AI, and the case file keeps
    only the masked text. Each conversation is kept for 7 days unless you ask me to forget it.
  source: Sakala AI POC privacy shield
  related: [mitra_pipeline, mitra_what]

