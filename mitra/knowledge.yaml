- id: sakala_2025_performance
  topic: Sakala performance in 2025
  ask: [sakala performance, 2025 performance, how did sakala do in 2025, late delivery, late percentage, rejected percentage, worst district, best district, bengaluru urban, kalaburagi, overdue in 2025, performance report]
  keys: [performance, 2025, late, rejected]
  data_ok: true
  say: >-
    In 2025 Sakala handled 35.2 million receipts statewide. 4.45 percent were delivered late and 7.42 percent were rejected.
    Overdue applications fell from 51,172 in January to 19,129 in December, a drop of 63 percent. Bengaluru Urban was the
    worst district at 9.18 percent late, Kalaburagi the best at 1.9 percent, and Mysuru stood at 5.46 percent.
  more: >-
    The official ranking barely separates the districts, with scores between 61 and 79, which is why this POC proposes a fairer
    scorecard. The three 2025 report files the team received are numerically identical and cover all departments together;
    department-wise exports still have to be requested from Sakala.
  source: Sakala district performance reports, 2025
  related: [sakala, cs_desk]

- id: mitra_what
  topic: What Mitra is
  ask: [what is mitra, what can you do, what do you do, what are you for, how can you help, what is this system, mitra means, what does mitra mean, who is mitra]
  keys: [mitra, help, do]
  say: >-
    I am Mitra, which means friend. I am the voice of Karnataka's grievance system: a citizen tells me a problem in English or
    Kannada and I file it, find the exact officer for that village and keep track of it. An officer can clear an inbox with me,
    and the Chief Secretary can ask me anything about the state's grievances.
  more: >-
    Say "Hey Mitra" to wake me, or just talk. I never guess: every number comes from the records, every officer from the official
    masters, and unclear requests go to a human scrutiny desk.
  source: Sakala AI POC
  related: [mitra_pipeline, routing_how, privacy]

- id: mitra_pipeline
  topic: The 8-stage pipeline
  ask: [how does it work, how does the pipeline work, 8 stages, eight stages, the pipeline, what happens to my complaint, what happens after i complain, behind the chat, behind your words, stages]
  keys: [pipeline, stages, works]
  say: >-
    A request goes through 8 stages: it enters from any channel, personal numbers are masked, the AI understands it against the
    official masters, a completion step asks only for what is missing, the place is validated and the citizen confirms, it is
    routed to the exact officer, the deadlines and reminders start, and it is live on the officer's and the Chief Secretary's screens.
  source: Sakala AI POC design
  related: [routing_how, privacy, escalation]

- id: routing_how
  topic: How routing works
  ask: [how do you decide the officer, how is it routed, how do you route, how does the routing work, how does routing work, exact officer, which officer gets it, routing accuracy, how accurate, accuracy, routing agreement, 97 percent, who decides the category, wrong category]
  keys: [routing, officer, accurate, accuracy, category]
  say: >-
    I pick the department, service and grievance type only from the official masters, then the village leads to its Gram
    Panchayat and to the named officer responsible there. The rules were learned from the real records, and given the right
    service and place the router picks the same officer iPGRS used in 97.6 percent of 673 real Mysuru cases.
  more: >-
    On the text alone, 40 real complaints were routed with 97.5 percent department accuracy, 95 percent service accuracy and
    92.5 percent exact-officer accuracy. Every decision keeps its evidence in the case file, and anything below the confidence
    threshold goes to a human scrutiny desk instead of being guessed.
  source: Sakala AI POC routing evaluation
  related: [scrutiny_desk, masters, pilot]

- id: scrutiny_desk
  topic: The scrutiny desk
  ask: [scrutiny desk, scrutiny, what if you are not sure, low confidence, unclear complaint, human check, who checks]
  keys: [scrutiny, unsure, unclear]
  say: >-
    When I am not sure which office a request belongs to, I do not guess. It goes to the scrutiny desk, a person at the Taluk
    Panchayat Executive Officer's office, who routes it to the right officer. The citizen is told the reference either way.
  source: Sakala AI POC guardrails
  related: [routing_how, ipgrs_routing]

