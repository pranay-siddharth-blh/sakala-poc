  ask: [1902, grievance helpline, ipgrs helpline, ipgrs number, complaint helpline, whom do i call for a complaint]
  keys: [helpline, 1902]
  say: >-
    The iPGRS grievance helpline is 1902. The Sakala call centre for applications is 080 4455 4455.
  source: ipgrs.karnataka.gov.in
