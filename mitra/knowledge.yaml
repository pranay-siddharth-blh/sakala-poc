- id: ipgrs_routing
  topic: How a grievance moves in iPGRS
  ask: [how does ipgrs route, how is a grievance escalated, escalated in ipgrs, grievance escalated, lmf, last mile functionary, l1 l2 l3, levels in ipgrs, who gets the grievance, who handles a grievance, action taken report, what is an atr, atr, escalate a grievance, how many times can i escalate]
  keys: [lmf, atr, route, levels, escalate]
  say: >-
    A grievance goes first to the Last Mile Functionary, the L1 field officer for that place, then up to L2 and L3 if it is
    not resolved. About 17,000 of these officers are mapped down to Gram Panchayat level. An Action Taken Report is mandatory
    before a case closes, and the citizen can escalate twice.
  more: >-
    A General or PrajaSeva Request, unlike a grievance, goes to a Secretary or head of department. The per-level day limits are
    not public; a 2023 Chief Minister's directive mentioned 15 days. The iPGRS form has 6 mandatory dropdowns, a 750-character
    description and the pin code. In this POC the demo clock uses 7, 5 and 3 days for the three levels, which is an assumption.
  source: negd.gov.in state directory 407; iPGRS portal
  related: [escalation, routing_how, scrutiny_desk]

- id: ipgrs_exclusions
  topic: What iPGRS does not take
  ask: [what is not a grievance, excluded topics, rti, right to information, sub judice, court case, suggestions, employee service matters, religious matters, wrong door]
  keys: [rti, sub-judice, excluded, suggestion]
  say: >-
    iPGRS does not take RTI requests, matters that are in court, religious matters, suggestions, or government employees'
    own service matters. Mitra tells the person the right door instead of filing those.
  source: iPGRS portal
  related: [ipgrs, routing_how]

- id: praja_seva
  topic: Praja Seva Department
  ask: [what is praja seva, praja seva, prajaseva, praja seva department, prajaseva department, new department, harsha gupta, principal secretary]
  keys: [praja, seva, harsha]
  say: >-
    The Praja Seva Department is Karnataka's new department for citizen services, approved by the cabinet on 20 June 2026.
    It merges the Sakala Mission, Public Grievances and Administrative Reforms. Its Principal Secretary is Harsha Gupta, posted on 3 July 2026.
  more: >-
    It runs the Praja Seva Abhiyana camps and the Wednesday grievance reviews, and on 11 September 2026 the government said it
    is deploying AI routing of grievances because citizens and operators often choose the wrong category. This POC is that routing.
  source: Government of Karnataka announcements, June to September 2026
  related: [praja_seva_abhiyana, wednesday_review, chief_secretary]

- id: praja_seva_abhiyana
  topic: Praja Seva Abhiyana
  ask: [praja seva abhiyana, abhiyana, saturday camps, camps, kudligi, grama one, karnataka one, where can i give my petition]
  keys: [abhiyana, camp, kudligi]
  say: >-
    Praja Seva Abhiyana is the Saturday grievance camp programme, launched on 5 September 2026 at Kudligi. Petitions given at
    the camps are digitised at the Grama One and Karnataka One counters and enter the same grievance system.
  more: >-
    In the real sample week, 41 percent of all grievances came through the Abhiyana camps, 24 percent through CSC centres,
    19 percent on the iPGRS website, 9 percent from the mobile app and 6 percent from the call centres.
  source: Government of Karnataka, September 2026; iPGRS sample data 3 to 9 October 2026
  related: [praja_seva, channels]

- id: wednesday_review
  topic: Wednesday review
  ask: [wednesday review, wednesday meeting, wednesday pack, review meeting, weekly review, who reviews grievances, review timings]
  keys: [wednesday, review]
  say: >-
    Every Wednesday the grievances are reviewed level by level: Tahsildars and Executive Officers from 9 to 11, Assistant
    Commissioners from 11 to 1, and Deputy Commissioners from 3 to 5. Mitra can read the Wednesday pack for any of those levels.
  source: Praja Seva Department review schedule
  related: [praja_seva, sakala_rules]

