# Mitra's knowledge base (22 Oct 2026). General questions ("what is Sakala?", "who is the Chief Secretary?") are answered
# from HERE and only from here, through the ask_knowledge function, on the live voice and the cascade alike. The model never
# answers such questions from its own memory. Every fact below was verified for the POC (see CLAUDE.md section 4); the
# assumptions are marked as such in the text itself.
#
# Fields: id · topic (the card title) · ask (ways people ask: phrases matched inside the question; also plain keywords) ·
# say (the spoken answer, one to three short sentences, numbers as digits) · more (detail for a follow-up) · source · related.

- id: sakala
  topic: Sakala
  ask: [what is sakala, sakala means, sakala act, tell me about sakala, explain sakala, sakala scheme, sakala services, what does sakala do, sakala guarantee]
  keys: [sakala]
  say: >-
    Sakala is Karnataka's guarantee of government services within a fixed time. The Sakala Services Act of 2011, in force
    since 2 April 2012, covers 1,446 services of 114 departments, and if a service is late the citizen is paid compensation.
  more: >-
    The Act was originally named the Karnataka Guarantee of Services to Citizens Act, which is why every acknowledgment is a
    GSC number. The portal has handled about 43 crore receipts. New applications go through Seva Sindhu or the department
    portals; Sakala tracks them and handles appeals. The tagline is "No more delays, we deliver on time".
  source: sakala.kar.nic.in (Act 1 of 2012, Rules 2012)
  related: [sakala_compensation, sakala_appeal, sakala_helpline, grievance_vs_sakala]

- id: sakala_compensation
  topic: Sakala compensation
  ask: [compensation, compensatory cost, how much compensation, 20 rupees, twenty rupees, 500 rupees, who pays the compensation, penalty for delay, cost of delay, section 9, section 11, form c, debit note, hrms debit]
  keys: [compensation, penalty, rupees, debit]
  say: >-
    Under section 9 of the Sakala Act a late service earns the citizen 20 rupees for every day of delay, capped at 500 rupees
    per application. Under section 11 the Competent Officer recovers that cost from the officer at fault.
  more: >-
    The recovery goes through a notice in Form C, with 7 days for the officer to reply; since the 2014 amendment the HRMS debit
    note is posted within 30 days. Compensation is paid from the office imprest first and recovered afterwards. It applies only
    to Sakala applications, never to iPGRS grievances, and in this POC the HRMS step is a mock that always needs a human approval.
  source: Sakala Act s.9, s.11(4); Sakala Rules 2012
  related: [sakala_appeal, sakala_rules, grievance_vs_sakala]

- id: sakala_appeal
  topic: Appeals under Sakala
  ask: [appeal, first appeal, second appeal, appellate authority, competent officer, designated officer, how do i appeal, appeal within, section 13, seven defaults, 7 defaults, enquiry against the officer, section 14]
  keys: [appeal, appellate]
  say: >-
    A Sakala application has three officers: the Designated Officer who delivers it, the Competent Officer for the first appeal
    within 30 days, and the Appellate Authority for the second appeal within 60 days. An officer with more than 7 defaults faces an enquiry.
  more: >-
    Section 13 sets the two appeal windows; section 14(4) sets the enquiry after 7 defaults. In the pilot the Designated Officer
    is the Tahsildar or Food Inspector, the Competent Officer the Assistant Commissioner or the Deputy Director of Food, and the
    Appellate Authority the Deputy Commissioner. This ladder is never mixed with the grievance ladder of iPGRS.
  source: Sakala Act s.13, s.14(4)
  related: [sakala_compensation, escalation, grievance_vs_sakala]

- id: sakala_rules
  topic: Sakala Rules 2012
  ask: [sakala rules, when does the clock start, incomplete application, public holidays, holidays excluded, form e-4, form e4, show cause notice, imprest]
  keys: [rules, clock, holidays, imprest, e-4]
  say: >-
    Under the Sakala Rules an incomplete application gets no delivery date; the clock starts only when it is complete. Public
    holidays are excluded, compensation is paid from imprest and then recovered, and Form E-4 is the show-cause notice to a defaulting officer.
  more: >-
    In this POC the Wednesday pack lists officers with more than 7 overdue cases as Form E-4 candidates.
  source: Sakala Rules 2012
  related: [sakala_compensation, wednesday_review]

