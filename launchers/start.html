<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting…</title>
<style>
  :root { --a:#16c784; --bg:#06080c; --tx:#eef2f6; --mute:#8b95a5; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; overflow:hidden; }
  body::before { content:""; position:fixed; inset:-20%; background:
      radial-gradient(40% 35% at 30% 30%, color-mix(in srgb, var(--a) 28%, transparent), transparent 70%),
      radial-gradient(35% 30% at 72% 70%, color-mix(in srgb, var(--a) 16%, transparent), transparent 70%);
    filter:blur(10px); animation:drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate(3%, -2%) scale(1.06); } }
  .wrap { position:relative; height:100%; display:grid; place-items:center; }
  .card { display:flex; flex-direction:column; align-items:center; gap:22px; animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } }
  .logo { position:relative; width:132px; height:132px; }
  .logo img { width:100%; height:100%; border-radius:30px; display:block; position:relative; z-index:1;
    box-shadow:0 18px 50px rgba(0,0,0,.55); animation:breathe 2.4s ease-in-out infinite; }
  .logo::before { content:""; position:absolute; inset:-26px; border-radius:50%; border:2px solid transparent;
    background:conic-gradient(from 0deg, transparent 0 55%, var(--a) 75%, transparent 92%) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spin 1.6s linear infinite; }
  .logo::after { content:""; position:absolute; inset:-30px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--a) 40%, transparent), transparent);
    filter:blur(12px); z-index:0; animation:breathe 2.4s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { transform:scale(1.035); } }
  h1 { margin:0; font-size:30px; font-weight:700; letter-spacing:.2px; }
  .sub { margin-top:-12px; color:var(--mute); font-size:14px; letter-spacing:.3px; }
  .bar { width:260px; height:3px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; width:35%; border-radius:3px; background:linear-gradient(90deg, transparent, var(--a), transparent);
    animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform:translateX(-110%); } to { transform:translateX(320%); } }
  .status { font-size:13px; color:var(--mute); min-height:18px; font-variant-numeric:tabular-nums; }
  .ok .bar i { width:100%; animation:none; background:var(--a); }
  .slow .status { color:#f0b35a; }
  .done { animation:out .35s ease-in forwards; }
  @keyframes out { to { opacity:0; transform:scale(1.02); filter:blur(4px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <div class="logo"><img id="logo" alt=""></div>
  <h1 id="name">Starting</h1>
  <div class="sub" id="sub">Starting the server</div>
  <div class="bar"><i></i></div>
  <div class="status" id="status"></div>
</div></div>
<script>
  // start.html?name=Mitra&url=http://localhost:8030&ping=http://127.0.0.1:8030/api/health&icon=icons/mitra.png&accent=%2316c784&log=...
  const P = new URLSearchParams(location.search);
  const name = P.get('name') || 'App', url = P.get('url'), ping = P.get('ping') || url;
  document.title = 'Starting ' + name + '…';
  document.getElementById('name').textContent = name;
  document.getElementById('logo').src = P.get('icon') || '';
  if (P.get('accent')) document.documentElement.style.setProperty('--a', P.get('accent'));
  const t0 = Date.now(), st = document.getElementById('status'), card = document.getElementById('card');
  async function up() {
    try { await fetch(ping + (ping.includes('?') ? '&' : '?') + '_=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }); return true; }
    catch (e) { return false; }
  }
  (async function loop() {
    while (true) {
      if (await up()) {
        document.body.classList.add('ok'); st.textContent = 'Ready';
        card.classList.add('done'); setTimeout(() => location.replace(url), 260); return;
      }
      const s = (Date.now() - t0) / 1000;
      st.textContent = s < 1 ? '' : `${s.toFixed(0)} s`;
      if (s > 45) { document.body.classList.add('slow');
        st.textContent = `Still starting after ${s.toFixed(0)} s. The log is in ${P.get('log') || 'the launcher log folder'}.`; }
      await new Promise(r => setTimeout(r, 200));
    }
  })();
</script>
</body>
</html>
